name: Update Blog Posts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install browser for social channels
        run: npx playwright-core install --with-deps --no-shell chromium

      - name: Check automatic social-link matching
        run: node --test scripts/__tests__/blog-dzen-sync.test.js scripts/__tests__/blog-vk-links.test.js scripts/__tests__/blog-vk-session.test.js scripts/__tests__/blog-vk-state.test.js scripts/__tests__/blog-vk-sync.test.js scripts/__tests__/blog-vk-reader.test.js

      - name: Prepare private VK session
        continue-on-error: true
        env:
          BLOG_VK_STATE: ${{ secrets.BLOG_VK_STATE }}
        run: node scripts/prepare-blog-vk-state.js

      - name: Fetch and update blog posts
        run: node scripts/update-blog.js

      - name: Remove private VK session
        if: always()
        run: node scripts/prepare-blog-vk-state.js --cleanup

      - name: Commit and push if changed
        run: |
          if git diff --quiet blog.html sitemap.xml data/blog-dzen-links.json data/blog-vk-links.json && ! (git status --porcelain images/blog/ | grep -q '.'); then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog.html images/blog/ sitemap.xml data/blog-dzen-links.json data/blog-vk-links.json
          git commit -m "Auto-update blog posts from Telegram"
          git push

      - name: Report failed Dzen sync
        if: env.BLOG_DZEN_SYNC_FAILED == 'true'
        run: |
          echo "::error title=Dzen synchronization failed::Existing links were preserved. The automatic Dzen reader needs attention."
          exit 1

      - name: Report failed VK sync
        if: always() && env.BLOG_VK_SYNC_FAILED == 'true'
        run: |
          echo "::error title=VK synchronization failed::Existing links were preserved. The VK channel reader or its login needs attention."
          exit 1
