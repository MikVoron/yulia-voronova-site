    # Only review-photo binary uploads accept 20 MiB and slow mobile connections.
    location ~ "^/content/reviews/[1-9][0-9]*/photos/[0-9a-fA-F-]{36}$" {
        limit_req zone=smartplate_api burst=40 nodelay;
        client_max_body_size 20m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_read_timeout 45s;
        proxy_send_timeout 120s;
        include /etc/nginx/snippets/smartplate-api-proxy.conf;
    }
