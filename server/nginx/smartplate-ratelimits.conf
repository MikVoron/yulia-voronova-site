# Install as /etc/nginx/conf.d/smartplate-ratelimits.conf.
# Zones are deliberately generous enough for shared family/office IPs while
# putting a hard ceiling in front of Node.js.
limit_req_zone $binary_remote_addr zone=smartplate_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=smartplate_auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=smartplate_payment:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=smartplate_feedback:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=smartplate_admin:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=smartplate_conn:10m;
