<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://voronova.online/">
  <title>Нет соединения — Юлия Воронова</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', Arial, sans-serif;
      background: #f9f5ee;
      color: #3a3a3a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 400;
      color: #5f6f62;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #6b6b6b;
      max-width: 320px;
      margin-bottom: 32px;
    }
    button {
      background: #8a9a8d;
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 14px 32px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #6d8071; }
  </style>
</head>
<body>
  <div class="icon">🌿</div>
  <h1>Нет соединения с интернетом</h1>
  <p>Проверьте подключение и попробуйте снова. Ранее просмотренные страницы доступны в кэше.</p>
  <button onclick="location.reload()">Обновить страницу</button>
</body>
</html>
