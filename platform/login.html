<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти — Умная тарелка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="style-v4.css" id="vcss"><script>document.getElementById('vcss').href='style-v4.css?v='+Date.now()</script>
    <style>
        body { background: #fff; }
        .lp-wrap {
            min-height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding: 48px 20px 40px;
        }
        .lp-logo { text-align: center; margin-bottom: 36px; }
        .lp-logo-img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
                       margin: 0 auto 12px; display: block; }
        .lp-logo-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(26px, 5vw, 36px); font-weight: 700;
            color: var(--text); line-height: 1.1;
        }
        .lp-logo-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 15px; font-weight: 600; color: var(--text);
            margin-top: 6px;
        }
        .lp-logo-prof {
            font-size: 12px; color: var(--text-3);
            margin-top: 2px; letter-spacing: .3px;
        }
        .lp-card { width: 100%; max-width: 380px; }
        .lp-step-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(18px, 4vw, 22px); font-weight: 700;
            color: var(--text); margin-bottom: 20px; line-height: 1.3;
        }
        .lp-field { margin-bottom: 14px; }
        .lp-label { display: block; font-size: 13px; font-weight: 600;
                    color: var(--text-2); margin-bottom: 6px; }
        .lp-input {
            width: 100%; padding: 13px 14px;
            border: 1.5px solid var(--border); border-radius: var(--r-m);
            font-size: 15px; font-family: inherit; color: var(--text);
            background: #fff; outline: none;
            transition: border-color .18s, box-shadow .18s;
        }
        .lp-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,64,10,.1); }
        .lp-input[readonly] { background: var(--bg-alt); color: var(--text-2); cursor: default; }
        .lp-input.code-input {
            font-size: 28px; letter-spacing: 12px; text-align: center;
            font-weight: 700; padding: 16px;
        }
        .lp-btn {
            width: 100%; padding: 14px; border-radius: var(--r-m);
            font-family: inherit; font-size: 15px; font-weight: 700;
            cursor: pointer; border: none; margin-bottom: 10px;
            transition: opacity .18s, transform .15s;
        }
        .lp-btn:active { transform: scale(.98); }
        .lp-btn:disabled { opacity: .5; cursor: not-allowed; }
        .lp-btn-primary { background: var(--accent); color: #fff; }
        .lp-btn-primary:hover:not(:disabled) { opacity: .9; }
        .lp-btn-back {
            background: none; border: 1.5px solid var(--border);
            color: var(--text-2); font-weight: 500; font-size: 14px;
            margin-bottom: 0;
        }
        .lp-error { color: #c0392b; font-size: 13px; margin-bottom: 10px; display: none; }
        .lp-hint { color: var(--text-3); font-size: 13px; margin-top: 8px; line-height: 1.5; }
        .lp-footer { margin-top: 32px; text-align: center; }
        .lp-footer-text { font-size: 12px; color: var(--text-3); line-height: 1.6; }
        .lp-footer-text a { color: var(--text-3); text-decoration: underline; }
        .lp-step { animation: fadeUp .3s ease both; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .lp-timer { color: var(--text-3); font-size: 13px; margin-top: 10px; text-align: center; }
        .lp-timer a { color: var(--accent); cursor: pointer; text-decoration: underline; }
        .lp-spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #fff;
                      border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite;
                      vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="lp-wrap">

    <div class="lp-logo">
        <img src="../images/YV-small.webp" alt="Юлия Воронова" class="lp-logo-img"
             onerror="this.style.display='none'">
        <div class="lp-logo-title">Умная тарелка</div>
        <div class="lp-logo-name">Юлия Воронова</div>
        <div class="lp-logo-prof">Доказательный нутрициолог</div>
    </div>

    <div class="lp-card">

        <!-- Step 1: Email -->
        <div id="step-email" class="lp-step">
            <div class="lp-step-title">Введите ваш email</div>
            <div class="lp-field">
                <input class="lp-input" type="email" id="email-input"
                       placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="lp-error" id="email-error"></div>
            <button class="lp-btn lp-btn-primary" id="send-code-btn" onclick="sendCode()">Получить код</button>
            <p class="lp-hint">Мы отправим 6-значный код на вашу почту</p>

            <div class="lp-footer">
                <p class="lp-footer-text">
                    Продолжая, вы соглашаетесь с<br>
                    <a href="../personal-data-processing-policy.html" target="_blank">политикой обработки персональных данных</a>
                </p>
            </div>
        </div>

        <!-- Step 2: Code -->
        <div id="step-code" class="lp-step" style="display:none">
            <div class="lp-step-title">Введите код из письма</div>
            <div class="lp-field">
                <label class="lp-label">Email</label>
                <input class="lp-input" type="email" id="email-display" readonly>
            </div>
            <div class="lp-field">
                <label class="lp-label" for="code-input">Код из письма</label>
                <input class="lp-input code-input" type="text" id="code-input"
                       placeholder="------" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <div class="lp-error" id="code-error"></div>
            <button class="lp-btn lp-btn-primary" id="verify-btn" onclick="verifyCode()">Войти</button>
            <div class="lp-timer" id="timer-block">
                Отправить повторно через <span id="timer-sec">60</span> сек
            </div>
            <button class="lp-btn lp-btn-back" onclick="goBack()">Другой email</button>
        </div>

    </div>
</div>

<script src="data-v2.js?v=1774300001"></script>
<script>
    if (Auth.isLoggedIn()) location.href = 'index.html';

    var currentEmail = '';
    var timerInterval = null;

    function showError(id, msg) {
        var el = document.getElementById(id);
        el.textContent = msg; el.style.display = 'block';
    }
    function hideError(id) { document.getElementById(id).style.display = 'none'; }

    function setLoading(btnId, loading) {
        var btn = document.getElementById(btnId);
        if (loading) {
            btn.disabled = true;
            btn.dataset.text = btn.textContent;
            btn.innerHTML = '<span class="lp-spinner"></span>Отправка...';
        } else {
            btn.disabled = false;
            btn.textContent = btn.dataset.text || 'Отправить';
        }
    }

    async function sendCode() {
        hideError('email-error');
        var email = document.getElementById('email-input').value.trim().toLowerCase();
        if (!email || !email.includes('@') || !email.includes('.')) {
            showError('email-error', 'Введите корректный email'); return;
        }
        currentEmail = email;
        setLoading('send-code-btn', true);
        try {
            var res = await fetch(API_BASE + '/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            var data = await res.json();
            if (!res.ok) { showError('email-error', data.error || 'Ошибка'); setLoading('send-code-btn', false); return; }
            showCodeStep();
        } catch (e) {
            showError('email-error', 'Ошибка сети');
        }
        setLoading('send-code-btn', false);
    }

    function showCodeStep() {
        document.getElementById('email-display').value = currentEmail;
        document.getElementById('step-email').style.display = 'none';
        var step2 = document.getElementById('step-code');
        step2.style.display = 'block';
        step2.style.animation = 'none';
        requestAnimationFrame(function() {
            step2.style.animation = 'fadeUp .3s ease both';
            document.getElementById('code-input').focus();
        });
        startTimer();
    }

    function startTimer() {
        var sec = 60;
        var timerEl = document.getElementById('timer-sec');
        var block = document.getElementById('timer-block');
        block.innerHTML = 'Отправить повторно через <span id="timer-sec">60</span> сек';
        timerEl = document.getElementById('timer-sec');
        clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            sec--;
            timerEl.textContent = sec;
            if (sec <= 0) {
                clearInterval(timerInterval);
                block.innerHTML = '<a onclick="resendCode()">Отправить код повторно</a>';
            }
        }, 1000);
    }

    async function resendCode() {
        var block = document.getElementById('timer-block');
        block.innerHTML = 'Отправка...';
        try {
            var res = await fetch(API_BASE + '/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail })
            });
            var data = await res.json();
            if (!res.ok) { block.innerHTML = '<span style="color:#c0392b">' + (data.error || 'Ошибка') + '</span>'; return; }
            startTimer();
        } catch (e) {
            block.innerHTML = '<span style="color:#c0392b">Ошибка сети</span>';
        }
    }

    async function verifyCode() {
        hideError('code-error');
        var code = document.getElementById('code-input').value.trim();
        if (code.length !== 6) { showError('code-error', 'Введите 6-значный код'); return; }
        setLoading('verify-btn', true);
        try {
            var res = await fetch(API_BASE + '/auth/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email: currentEmail, code: code })
            });
            var data = await res.json();
            if (!res.ok) { showError('code-error', data.error || 'Ошибка'); setLoading('verify-btn', false); return; }
            Auth.login(data.user.email, data.user.displayName, data.accessToken, data.user.subscription);
            location.href = 'index.html';
        } catch (e) {
            showError('code-error', 'Ошибка сети');
            setLoading('verify-btn', false);
        }
    }

    function goBack() {
        clearInterval(timerInterval);
        document.getElementById('step-code').style.display = 'none';
        document.getElementById('code-input').value = '';
        var s1 = document.getElementById('step-email');
        s1.style.display = 'block';
        s1.style.animation = 'none';
        requestAnimationFrame(function() { s1.style.animation = 'fadeUp .3s ease both'; });
        document.getElementById('email-input').focus();
    }

    // Enter & auto-submit
    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        if (document.getElementById('step-email').style.display !== 'none') sendCode();
        else verifyCode();
    });
    document.getElementById('code-input').addEventListener('input', function() {
        if (this.value.length === 6) verifyCode();
    });
</script>
</body>
</html>
