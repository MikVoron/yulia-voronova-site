<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти — Умная тарелка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #e8400a;
            --accent-d: #c73208;
            --accent-l: #fff2ed;
            --accent-glow: rgba(232,64,10,.15);
            --bg: #ffffff;
            --bg-alt: #faf8f5;
            --bg-card: #ffffff;
            --bg-input: #faf8f5;
            --border: #e5e5e5;
            --text: #111111;
            --text-2: #444444;
            --text-3: #777777;
        }

        body {
            font-family: 'Montserrat', system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow orbs */
        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            top: -15%; left: -10%;
            background: radial-gradient(circle, rgba(232,64,10,.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            bottom: -20%; right: -15%;
            background: radial-gradient(circle, rgba(232,64,10,.04) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .lp-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        /* Top branding */
        .lp-brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .lp-brand-ava {
            width: 64px; height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #eee;
            margin-bottom: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08), 0 0 30px var(--accent-glow);
        }

        .lp-brand-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
        }

        .lp-brand-title span {
            color: var(--accent);
        }

        .lp-brand-sub {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            margin-top: 4px;
        }

        /* Card */
        .lp-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 32px 32px;
            box-shadow: 0 4px 32px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
            position: relative;
            overflow: hidden;
        }

        /* Subtle top glow line */
        .lp-card::before {
            content: '';
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: .5;
        }

        .lp-step-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .lp-step-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            background: var(--accent-l);
            border: 1px solid #fdd9c8;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            font-size: 24px;
        }

        .lp-step-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .lp-step-desc {
            font-size: 15px;
            color: var(--text);
            line-height: 1.5;
        }

        .lp-step-desc strong { color: var(--text); font-weight: 700; }

        /* Inputs */
        .lp-field { margin-bottom: 16px; }

        .lp-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }

        .lp-input {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 500;
            color: var(--text);
            background: var(--bg-input);
            outline: none;
            transition: all .2s;
        }

        .lp-input::placeholder { color: #bbb; }

        .lp-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .lp-input[readonly] {
            color: var(--text-3);
            opacity: .7;
        }

        .lp-input.code-input {
            font-size: 30px;
            letter-spacing: 14px;
            text-align: center;
            font-weight: 700;
            padding: 18px;
        }

        /* Buttons */
        .lp-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            margin-bottom: 10px;
            transition: all .2s;
        }

        .lp-btn:active { transform: scale(.98); }
        .lp-btn:disabled { opacity: .35; cursor: not-allowed; }

        .lp-btn-primary {
            background: linear-gradient(135deg, #e8400a 0%, #ff6b3d 100%);
            color: #fff;
            box-shadow: 0 4px 16px rgba(232,64,10,.25);
        }

        .lp-btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 24px rgba(232,64,10,.35);
            transform: translateY(-1px);
        }

        .lp-btn-ghost {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-2);
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 0;
        }

        .lp-btn-ghost:hover {
            background: #eee;
            color: var(--text);
        }

        /* OAuth buttons */
        .lp-divider {
            display: flex; align-items: center; gap: 14px;
            margin: 20px 0 16px; color: var(--text-3); font-size: 13px; font-weight: 500;
        }
        .lp-divider::before, .lp-divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        .lp-oauth-row { display: flex; gap: 10px; }

        .lp-btn-oauth {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 12px; border-radius: 12px; border: 2px solid var(--border);
            background: var(--bg-card); font-family: inherit; font-size: 14px; font-weight: 600;
            color: var(--text); cursor: pointer; transition: all .2s; text-decoration: none;
        }
        .lp-btn-oauth:hover { border-color: var(--text-3); background: var(--bg-alt); }
        .lp-btn-oauth svg { flex-shrink: 0; }

        .lp-error {
            color: #c0392b;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
            background: #fef2f2;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #fecaca;
        }

        .lp-hint {
            color: var(--text-2);
            font-size: 14px;
            font-weight: 500;
            margin-top: 14px;
            line-height: 1.6;
            text-align: center;
        }

        .lp-step { animation: fadeUp .35s ease both; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .lp-timer {
            color: var(--text-2);
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
        }

        .lp-timer a {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .lp-timer a:hover { text-decoration: underline; }

        .lp-spinner {
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Success */
        .lp-success {
            display: none;
            text-align: center;
            padding: 24px 0;
            animation: fadeUp .35s ease both;
        }

        .lp-success-glow {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e8400a, #ff6b3d);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            animation: glowPulse .6s ease both;
            box-shadow: 0 4px 24px rgba(232,64,10,.25);
        }

        .lp-success-glow svg {
            width: 32px; height: 32px;
            stroke: #fff;
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes glowPulse {
            0% { transform: scale(0); box-shadow: 0 0 0 rgba(232,64,10,0); }
            50% { transform: scale(1.15); box-shadow: 0 6px 32px rgba(232,64,10,.3); }
            100% { transform: scale(1); box-shadow: 0 4px 24px rgba(232,64,10,.25); }
        }

        .lp-success-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 700;
        }

        .lp-success-sub {
            font-size: 15px;
            color: var(--text-2);
            margin-top: 4px;
        }

        /* Footer */
        .lp-footer {
            margin-top: 24px;
            text-align: center;
        }

        .lp-footer-text {
            font-size: 12px;
            color: var(--text-2);
            line-height: 1.7;
        }

        .lp-footer-text a { color: var(--text-2); text-decoration: underline; }
        .lp-footer-text a:hover { color: var(--text); }

        /* Features below card */
        .lp-features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .lp-feat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-2);
            font-weight: 500;
        }

        .lp-feat-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px rgba(232,64,10,.3);
        }

        @media (max-width: 480px) {
            .lp-card { padding: 28px 20px 24px; border-radius: 16px; }
            .lp-brand-title { font-size: 26px; }
            .lp-features { gap: 14px; }
        }
    </style>
</head>
<body>

<div class="lp-container">
    <div class="lp-brand">
        <img src="../images/YV-small.webp" alt="Юлия Воронова" class="lp-brand-ava"
             onerror="this.style.display='none'">
        <div class="lp-brand-title">Умная <span>тарелка</span></div>
        <div class="lp-brand-sub">Юлия Воронова &middot; Нутрициолог</div>
    </div>

    <div class="lp-card">

        <!-- Step 1: Email -->
        <div id="step-email" class="lp-step">
            <div class="lp-step-header">
                <div class="lp-step-icon">&#128274;</div>
                <div class="lp-step-title">Войти</div>
            </div>
            <div class="lp-field">
                <label class="lp-label" for="email-input">Email</label>
                <input class="lp-input" type="email" id="email-input"
                       placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="lp-error" id="email-error"></div>
            <button class="lp-btn lp-btn-primary" id="send-code-btn" onclick="sendCode()">Получить код</button>
            <p class="lp-hint">Без пароля. 6-значный код на почту.</p>

            <!-- OAuth кнопки (VK/Yandex) — код готов, включить после регистрации приложений -->

            <div class="lp-footer">
                <p class="lp-footer-text">
                    Продолжая, вы соглашаетесь с
                    <a href="../personal-data-processing-policy.html" target="_blank">политикой обработки данных</a>
                </p>
            </div>
        </div>

        <!-- Step 2: Code -->
        <div id="step-code" class="lp-step" style="display:none">
            <div class="lp-step-header">
                <div class="lp-step-icon">&#9993;&#65039;</div>
                <div class="lp-step-title">Введите код</div>
                <div class="lp-step-desc">Отправили на <strong id="email-show-text"></strong></div>
            </div>
            <div class="lp-field">
                <input class="lp-input code-input" type="text" id="code-input"
                       placeholder="------" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
            </div>
            <div class="lp-error" id="code-error"></div>
            <button class="lp-btn lp-btn-primary" id="verify-btn" onclick="verifyCode()">Войти</button>
            <div class="lp-timer" id="timer-block">
                Отправить повторно через <span id="timer-sec">60</span> сек
            </div>
            <div style="height:6px"></div>
            <button class="lp-btn lp-btn-ghost" onclick="goBack()">&#8592; Другой email</button>
        </div>

        <!-- Step 3: Success -->
        <div id="step-success" class="lp-success">
            <div class="lp-success-glow">
                <svg viewBox="0 0 24 24"><polyline points="6 12 10 16 18 8"/></svg>
            </div>
            <div class="lp-success-title">Добро пожаловать</div>
            <div class="lp-success-sub">Загружаем платформу...</div>
        </div>

    </div>

    <div class="lp-features">
        <div class="lp-feat"><div class="lp-feat-dot"></div>36+ рецептов</div>
        <div class="lp-feat"><div class="lp-feat-dot"></div>КБЖУ расчёт</div>
        <div class="lp-feat"><div class="lp-feat-dot"></div>Конструктор тарелки</div>
    </div>
</div>

<script src="data-v2.js?v=1774300002"></script>
<script>
    var _returnUrl = new URLSearchParams(location.search).get('return') || 'index.html';
    if (Auth.isLoggedIn()) location.href = _returnUrl;

    // Show OAuth error if redirected back
    (function() {
        var params = new URLSearchParams(location.search);
        var err = params.get('error');
        if (err === 'blocked') showError('email-error', 'Аккаунт заблокирован');
        else if (err) showError('email-error', 'Ошибка входа. Попробуйте другой способ.');
    })();

    var currentEmail = '';
    var timerInterval = null;

    function showError(id, msg) {
        var el = document.getElementById(id);
        el.textContent = msg; el.style.display = 'block';
    }
    function hideError(id) { document.getElementById(id).style.display = 'none'; }

    function setLoading(btnId, loading) {
        var btn = document.getElementById(btnId);
        if (loading) {
            btn.disabled = true;
            btn.dataset.text = btn.textContent;
            btn.innerHTML = '<span class="lp-spinner"></span>Отправка...';
        } else {
            btn.disabled = false;
            btn.textContent = btn.dataset.text || 'Отправить';
        }
    }

    async function sendCode() {
        hideError('email-error');
        var email = document.getElementById('email-input').value.trim().toLowerCase();
        if (!email || !email.includes('@') || !email.includes('.')) {
            showError('email-error', 'Введите корректный email'); return;
        }
        currentEmail = email;
        setLoading('send-code-btn', true);
        try {
            var res = await fetch(API_BASE + '/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            var data = await res.json();
            if (!res.ok) { showError('email-error', data.error || 'Ошибка'); setLoading('send-code-btn', false); return; }
            showCodeStep();
        } catch (e) {
            showError('email-error', 'Ошибка сети');
        }
        setLoading('send-code-btn', false);
    }

    function showCodeStep() {
        document.getElementById('email-show-text').textContent = currentEmail;
        document.getElementById('step-email').style.display = 'none';
        var step2 = document.getElementById('step-code');
        step2.style.display = 'block';
        step2.style.animation = 'none';
        requestAnimationFrame(function() {
            step2.style.animation = 'fadeUp .35s ease both';
            document.getElementById('code-input').focus();
        });
        startTimer();
    }

    function startTimer() {
        var sec = 60;
        var timerEl = document.getElementById('timer-sec');
        var block = document.getElementById('timer-block');
        block.innerHTML = 'Отправить повторно через <span id="timer-sec">60</span> сек';
        timerEl = document.getElementById('timer-sec');
        clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            sec--;
            timerEl.textContent = sec;
            if (sec <= 0) {
                clearInterval(timerInterval);
                block.innerHTML = '<a onclick="resendCode()">Отправить код повторно</a>';
            }
        }, 1000);
    }

    async function resendCode() {
        var block = document.getElementById('timer-block');
        block.innerHTML = 'Отправка...';
        try {
            var res = await fetch(API_BASE + '/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: currentEmail })
            });
            var data = await res.json();
            if (!res.ok) { block.innerHTML = '<span style="color:#c0392b">' + (data.error || 'Ошибка') + '</span>'; return; }
            startTimer();
        } catch (e) {
            block.innerHTML = '<span style="color:#c0392b">Ошибка сети</span>';
        }
    }

    async function verifyCode() {
        hideError('code-error');
        var code = document.getElementById('code-input').value.trim();
        if (code.length !== 6) { showError('code-error', 'Введите 6-значный код'); return; }
        setLoading('verify-btn', true);
        try {
            var res = await fetch(API_BASE + '/auth/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email: currentEmail, code: code })
            });
            var data = await res.json();
            if (!res.ok) { showError('code-error', data.error || 'Ошибка'); setLoading('verify-btn', false); return; }
            Auth.login(data.user.email, data.user.displayName, data.accessToken, data.user.subscription);
            document.getElementById('step-code').style.display = 'none';
            var success = document.getElementById('step-success');
            success.style.display = 'block';
            success.style.animation = 'fadeUp .35s ease both';
            setTimeout(function() { location.href = _returnUrl; }, 900);
        } catch (e) {
            showError('code-error', 'Ошибка сети');
            setLoading('verify-btn', false);
        }
    }

    function goBack() {
        clearInterval(timerInterval);
        document.getElementById('step-code').style.display = 'none';
        document.getElementById('code-input').value = '';
        var s1 = document.getElementById('step-email');
        s1.style.display = 'block';
        s1.style.animation = 'none';
        requestAnimationFrame(function() { s1.style.animation = 'fadeUp .35s ease both'; });
        document.getElementById('email-input').focus();
    }

    document.addEventListener('keydown', function(e) {
        if (e.key !== 'Enter') return;
        if (document.getElementById('step-email').style.display !== 'none') sendCode();
        else if (document.getElementById('step-code').style.display !== 'none') verifyCode();
    });
    document.getElementById('code-input').addEventListener('input', function() {
        if (this.value.length === 6) verifyCode();
    });
</script>
</body>
</html>
