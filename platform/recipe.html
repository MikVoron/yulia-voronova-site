<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт — Гарвардская тарелка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="platform.css">
    <style>
        .recipe-page-hero {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            position: relative;
            overflow: hidden;
        }
        .recipe-page-hero-bg {
            position: absolute;
            inset: 0;
            opacity: .15;
        }

        .timer-widget {
            background: var(--beige);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .timer-display {
            font-family: var(--font-serif);
            font-size: 32px;
            font-weight: 600;
            color: var(--sage-dark);
            min-width: 80px;
        }
        .timer-controls { display: flex; gap: 8px; }
        .timer-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--white);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            cursor: pointer;
            border: none;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .timer-btn:hover { background: var(--sage-light); }
        .timer-btn.running { background: var(--sage); }

        .sticky-cta {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            background: var(--white);
            padding: 12px 20px 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,.1);
            z-index: 50;
        }
    </style>
</head>
<body class="hp-page" style="padding-bottom:90px">

<!-- HEADER -->
<header class="hp-header">
    <div class="hp-header-inner">
        <button class="hp-header-back" onclick="history.back()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Назад
        </button>
        <div id="header-title" style="font-size:14px;font-weight:700;color:var(--text);text-align:center;flex:1"></div>
        <div style="width:60px"></div>
    </div>
</header>

<!-- CONTENT -->
<main id="recipe-content">
    <!-- Populated by JS -->
    <div style="display:flex;align-items:center;justify-content:center;height:300px;color:var(--text-light)">
        Загрузка...
    </div>
</main>

<!-- Sticky CTA -->
<div class="sticky-cta" id="sticky-cta" style="display:none">
    <button class="btn btn-primary btn-full btn-lg" id="cta-btn">+ Добавить в тарелку</button>
</div>

<script src="data.js"></script>
<script>
    Auth.requireAuth('login.html');

    var params = new URLSearchParams(location.search);
    var recipeId = params.get('id');
    var sectorParam = params.get('sector'); // optional: pre-set sector

    var recipe = recipeId ? getRecipeById(recipeId) : null;

    if (!recipe) {
        document.getElementById('recipe-content').innerHTML =
            '<div style="text-align:center;padding:80px 20px">' +
            '<div style="font-size:48px">😕</div>' +
            '<div style="margin-top:12px;font-size:16px;color:var(--text-mid)">Рецепт не найден</div>' +
            '<a href="constructor.html" class="btn btn-primary" style="margin-top:20px;display:inline-flex">← Конструктор</a>' +
            '</div>';
    } else {
        renderRecipe(recipe);
    }

    function renderRecipe(r) {
        document.getElementById('header-title').textContent = r.name;
        document.title = r.name + ' — Гарвардская тарелка';

        var diffLabel = DIFFICULTY_LABELS[r.difficulty] || r.difficulty;

        // Detect category
        var category = null;
        if (RECIPES.vegetables.find(x => x.id === r.id)) category = 'vegetables';
        else if (RECIPES.grains.find(x => x.id === r.id)) category = 'grains';
        else category = 'protein';
        var catLabel = CATEGORY_LABELS[category];

        var state = PlateState.get();
        var isSelected = state[sectorParam || category] === r.id;

        var html =
        '<div class="recipe-page-hero">' +
            '<div class="recipe-page-hero-bg" style="background:' + r.color + '"></div>' +
            r.emoji +
        '</div>' +

        '<div style="padding:0 20px">' +

        '<div style="margin-top:20px">' +
            '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);margin-bottom:6px">' + catLabel + '</div>' +
            '<h1 style="font-family:var(--font-serif);font-size:26px;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:12px">' + r.name + '</h1>' +
            '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">' +
                '<span class="chip active">⏱ ' + r.time + ' мин</span>' +
                '<span class="chip active">⚡ ' + diffLabel + '</span>' +
                r.tags.map(function(t) { return '<span class="chip">' + t + '</span>'; }).join('') +
            '</div>' +
        '</div>' +

        '<div class="kbzhu-strip" style="margin-bottom:20px">' +
            '<div class="kbzhu-item kcal"><div class="kbzhu-value">' + r.kcal + '</div><div class="kbzhu-label">Ккал</div></div>' +
            '<div class="kbzhu-item"><div class="kbzhu-value">' + r.protein + 'г</div><div class="kbzhu-label">Белки</div></div>' +
            '<div class="kbzhu-item"><div class="kbzhu-value">' + r.fat + 'г</div><div class="kbzhu-label">Жиры</div></div>' +
            '<div class="kbzhu-item"><div class="kbzhu-value">' + r.carbs + 'г</div><div class="kbzhu-label">Углеводы</div></div>' +
        '</div>' +

        '<div style="margin-bottom:20px">' +
            '<div class="recipe-section-title">Ингредиенты</div>' +
            '<div class="ingredients-list">' +
                r.ingredients.map(function(ing) {
                    return '<div class="ingredient-item">' +
                        '<div class="ingredient-dot" style="background:' + r.color + '"></div>' + ing + '</div>';
                }).join('') +
            '</div>' +
        '</div>' +

        '<div style="margin-bottom:20px">' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' +
                '<div class="recipe-section-title" style="margin-bottom:0">Приготовление</div>' +
                '<button class="btn btn-sm btn-ghost" onclick="startTimer(' + r.time + ')" style="gap:4px;font-size:11px">⏱ Таймер ' + r.time + ' мин</button>' +
            '</div>' +
            '<div id="timer-widget" style="display:none;margin-bottom:14px" class="timer-widget">' +
                '<div>' +
                    '<div style="font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Таймер</div>' +
                    '<div class="timer-display" id="timer-display">00:00</div>' +
                '</div>' +
                '<div class="timer-controls">' +
                    '<button class="timer-btn" id="timer-pause-btn" onclick="toggleTimer()" title="Пауза">⏸</button>' +
                    '<button class="timer-btn" onclick="stopTimer()" title="Стоп">⏹</button>' +
                '</div>' +
            '</div>' +
            '<div class="steps-list">' +
                r.steps.map(function(step, i) {
                    return '<div class="step-item" id="step-' + i + '">' +
                        '<div class="step-num">' + (i+1) + '</div>' +
                        '<div>' + step + '</div></div>';
                }).join('') +
            '</div>' +
        '</div>' +

        '<div style="margin-bottom:20px">' +
            '<div class="recipe-section-title">Замены ингредиентов</div>' +
            '<div class="substitutes-list">' +
                r.substitutes.map(function(s) {
                    return '<div class="substitute-item">↔ ' + s + '</div>';
                }).join('') +
            '</div>' +
        '</div>' +

        '<div class="julias-tip" style="margin:0 0 20px">' +
            '<div class="julias-tip-head">🌿 Совет Юлии</div>' +
            '<div class="julias-tip-text">' + r.julias_tip + '</div>' +
        '</div>' +

        '</div>'; // /padding

        document.getElementById('recipe-content').innerHTML = html;

        // Sticky CTA
        var cta = document.getElementById('sticky-cta');
        var ctaBtn = document.getElementById('cta-btn');
        cta.style.display = 'block';
        if (isSelected) {
            ctaBtn.textContent = '✕ Убрать с тарелки';
            ctaBtn.className = 'btn btn-ghost btn-full btn-lg';
            ctaBtn.onclick = function() { removeDish(category); };
        } else {
            ctaBtn.textContent = '+ Добавить в тарелку';
            ctaBtn.className = 'btn btn-primary btn-full btn-lg';
            ctaBtn.onclick = function() { addToPlate(r.id, category); };
        }
    }

    function addToPlate(recipeId, category) {
        PlateState.addDish(category, recipeId);
        showToast(recipe.emoji + ' Добавлено в тарелку!');
        // Update CTA
        var ctaBtn = document.getElementById('cta-btn');
        ctaBtn.textContent = '✕ Убрать с тарелки';
        ctaBtn.className = 'btn btn-ghost btn-full btn-lg';
        ctaBtn.onclick = function() { removeDish(category); };
        setTimeout(function() { window.location.href = 'constructor.html'; }, 900);
    }

    function removeDish(category) {
        PlateState.removeDish(category);
        showToast('Блюдо убрано с тарелки');
        var ctaBtn = document.getElementById('cta-btn');
        ctaBtn.textContent = '+ Добавить в тарелку';
        ctaBtn.className = 'btn btn-primary btn-full btn-lg';
        ctaBtn.onclick = function() { addToPlate(recipe.id, category); };
    }

    // ── TIMER ─────────────────────────────────────────────────────────────
    var timerSeconds = 0;
    var timerInterval = null;
    var timerRunning = false;

    function startTimer(minutes) {
        timerSeconds = minutes * 60;
        document.getElementById('timer-widget').style.display = 'flex';
        updateTimerDisplay();
        timerRunning = true;
        timerInterval = setInterval(tickTimer, 1000);
        document.getElementById('timer-pause-btn').textContent = '⏸';
    }

    function tickTimer() {
        if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            timerRunning = false;
            showToast('⏰ Время вышло! Блюдо готово!');
            document.getElementById('timer-pause-btn').textContent = '▶';
            return;
        }
        timerSeconds--;
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        var m = Math.floor(timerSeconds / 60);
        var s = timerSeconds % 60;
        document.getElementById('timer-display').textContent =
            (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function toggleTimer() {
        if (timerRunning) {
            clearInterval(timerInterval);
            timerRunning = false;
            document.getElementById('timer-pause-btn').textContent = '▶';
        } else {
            timerRunning = true;
            timerInterval = setInterval(tickTimer, 1000);
            document.getElementById('timer-pause-btn').textContent = '⏸';
        }
    }

    function stopTimer() {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById('timer-widget').style.display = 'none';
    }
</script>
</body>
</html>
