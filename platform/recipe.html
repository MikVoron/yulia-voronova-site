<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рецепт — Конструктор питания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700;800&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
    <style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="style-v4.css" id="vcss"><script>document.getElementById('vcss').href='style-v4.css?v='+Date.now()</script>
    <style>
        .sublist-items { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body class="v-page" style="padding-bottom: 90px;">

<!-- HEADER -->
<header class="v-header" id="hdr">
    <div class="v-wrap">
        <div class="vh-inner">
            <button class="vh-back-btn" id="back-btn" aria-label="Назад">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                <span id="back-label" style="display:none"></span>
            </button>
            <a href="index.html" class="vh-brand">
                <span class="vh-brand-meta">
                    <span class="vh-brand-name">Юлия Воронова</span>
                    <span class="vh-brand-role">нутрициолог</span>
                </span>
                <span class="vh-brand-title">Умная <span class="vh-accent">тарелка</span></span>
            </a>
            <div class="vh-slogan-wrap">
                <span class="vh-slogan">Персональный помощник в сбалансированном питании</span>
            </div>
            <div class="v-user-wrap" id="user-wrap">
                <button class="vh-profile-pill" id="user-badge" onclick="toggleUserMenu(event)" type="button">
                    <div class="v-user-avatar" id="u-ava" style="width:34px;height:34px;overflow:hidden;flex-shrink:0;border-radius:50%">?</div>
                    <span class="vh-profile-name" id="u-name">Войти</span>
                </button>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="cabinet.html" class="user-dd-item">👤 Мой кабинет</a>
                    <div class="user-dd-sep"></div>
                    <button class="user-dd-item user-dd-logout" onclick="doLogout()">🚪 Выйти</button>
                </div>
            </div>
            <button class="vh-plate-btn" onclick="openPlate()" type="button" aria-label="Моя тарелка">
                <span class="vh-plate-icon" style="position:relative;width:25px;height:25px;display:inline-block;overflow:hidden;border-radius:50%;flex-shrink:0">
                    <span class="vh-slice vh-slice-g"></span>
                    <span class="vh-slice vh-slice-y"></span>
                    <span class="vh-slice vh-slice-r"></span>
                </span>
                <span class="plate-count" style="display:none">0</span>
            </button>
        </div>
    </div>
</header>

<!-- CONTENT -->
<main style="flex:1;">
    <div class="v-wrap" id="page-content" style="padding-top:24px; padding-bottom:24px;"></div>
</main>

<!-- STICKY ADD BUTTON -->
<div class="sticky-add" id="sticky-add" style="display:none">
    <div class="sticky-add-inner" style="display:flex;justify-content:center">
        <button class="btn btn-orange btn-lg" id="add-btn" style="width:100%;max-width:400px" onclick="addToPlate()">
            + Добавить в тарелку
        </button>
    </div>
</div>

<!-- MY PLATE MODAL -->
<div class="modal-overlay" id="plate-overlay" onclick="closePlateIfOutside(event)">
    <div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <div class="modal-title"><span class="modal-plate-icon"><span class="vh-slice vh-slice-g"></span><span class="vh-slice vh-slice-y"></span><span class="vh-slice vh-slice-r"></span></span> Моя тарелка</div>
            <button class="modal-close" onclick="closePlate()">✕</button>
        </div>
        <div class="modal-body" id="plate-body"></div>
    </div>
</div>

<!-- CHAT FAB -->
<button class="chat-fab" id="tawk-fab" onclick="openTawk()" title="Чат с отделом заботы">
    <svg class="chat-fab-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
</button>

<script src="data-v2.js?v=1774300005"></script>
<script>
    Auth.requireAuth();
    Auth.checkAccess();
    updatePlateIcon();

    // User pill init
    (function() {
        const user = Auth.getUser();
        if (!user) return;
        const customName = Auth.getDisplayName();
        const displayName = customName || user.email.split('@')[0];
        const uAva = document.getElementById('u-ava');
        const savedAva = localStorage.getItem(Auth._userKey('user_avatar'));
        if (savedAva) {
            uAva.innerHTML = `<img src="${savedAva}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        } else {
            uAva.textContent = (customName || user.email || '?').charAt(0).toUpperCase();
        }
        document.getElementById('u-name').textContent = displayName;
    })();

    function toggleUserMenu(e) {
        e.stopPropagation();
        document.getElementById('user-dropdown').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
        const wrap = document.getElementById('user-wrap');
        if (wrap && !wrap.contains(e.target)) document.getElementById('user-dropdown').classList.remove('open');
    });
    function doLogout() {
        document.getElementById('user-dropdown').classList.remove('open');
        const overlay = document.createElement('div');
        overlay.className = 'farewell-overlay';
        overlay.innerHTML = '<div class="farewell-emoji">👋</div><div class="farewell-text">До встречи!</div><div class="farewell-sub">Возвращайтесь — мы ждём вас</div>';
        document.body.appendChild(overlay);
        requestAnimationFrame(() => overlay.classList.add('show'));
        setTimeout(() => { Auth.logout(); location.href = 'login.html'; }, 1800);
    }

    // Фото-заглушки по категориям (временно — из блога и гайда)
    const PHOTO_BY_CAT = {
        breakfasts: '../images/blog/post-290.webp',
        mains:      '../images/cook-healthy-food.webp',
        pancakes:   '../images/blog/random-pic-blog-2.webp',
        spreads:    '../images/blog/random-pic-blog-3.webp',
        salads:     '../images/blog/random-pic-blog-4.webp',
        drinks:     '../images/blog/random-pic-blog-1.webp',
        _sides:     '../images/blog/post-281.webp',
    };
    const PHOTO_FALLBACK = '../images/background-guide.webp';

    window.addEventListener('scroll', () =>
        document.getElementById('hdr').classList.toggle('scrolled', scrollY > 10));

    const params = new URLSearchParams(location.search);
    const recipeId = params.get('id');
    const fromCat  = params.get('from') || '';
    const simpleMode = params.get('simple') === '1';
    let r, cat;

    // Must be declared before renderRecipe is called (used inside buildGroup)
    const subItemRegistry = {};
    const GROUP_CLASS = { p: 'group-protein', f: 'group-fat', c: 'group-carbs', fi: 'group-fiber' };

    function initRecipe() {
        r = RECIPES[recipeId];
        if (r && !Auth.canViewRecipe(r)) {
            Auth._showPaywall('trial');
        }
        cat = (fromCat && fromCat !== 'plate') ? CATEGORIES[fromCat] : null;

        // Back button
        const backBtn = document.getElementById('back-btn');
        if (fromCat === 'plate') {
            backBtn.onclick = () => location.href = 'index.html';
            document.getElementById('back-label').textContent = 'Тарелка';
        } else {
            backBtn.onclick = () => fromCat ? location.href = 'category.html?cat=' + fromCat : location.href = 'index.html';
            if (cat) document.getElementById('back-label').textContent = cat.name;
        }

        if (!r) {
        document.getElementById('page-content').innerHTML =
            '<div style="text-align:center;padding:80px 20px">' +
            '<div style="font-size:48px">😕</div>' +
            '<div style="font-size:16px;color:var(--text-2);margin-top:12px">Рецепт не найден</div>' +
            '<button class="btn btn-green" style="margin-top:20px" onclick="history.back()">← Назад</button>' +
            '</div>';
    } else if (r.isSublist) {
        renderSublist(r);
    } else {
        renderRecipe(r);
    }
    } // end initRecipe

    loadContent().then(initRecipe);

    // ── SUBLIST (e.g. Здоровые бутерброды → список намазок) ─────────────
    function renderSublist(r) {
        document.title = r.name + ' — Конструктор питания';
        const items = (r.subItems || []).map(id => RECIPES[id]).filter(Boolean);
        const html = `
            <div class="anim">
                <div style="font-size:40px;margin-bottom:10px">${r.emoji}</div>
                <h1 class="recipe-title" style="margin-bottom:6px">${r.name}</h1>
                <div class="sublist-note">Выберите намазку — откроется её рецепт</div>
                <div class="sublist-items">
                    ${items.map(item => `
                        <button class="dish-card anim" onclick="location.href='recipe.html?id=${item.id}&from=${fromCat}'">
                            <div class="dish-emoji-box" style="background:var(--green-l)">${item.emoji}</div>
                            <div class="dish-info">
                                <div class="dish-name">${item.name}</div>
                                <div class="dish-meta">
                                    <span class="pill">⏱ ${item.time} мин</span>
                                    <span class="pill">${DIFF_LABELS[item.diff] || item.diff}</span>
                                </div>
                            </div>
                            <div class="dish-kcal">${item.kcal}<span>ккал</span></div>
                            <div class="dish-arrow">›</div>
                        </button>`).join('')}
                </div>
                ${r.tip ? `<div class="julia-tip anim" style="margin-top:20px">
                    <img src="../images/YV-small.webp" alt="Юлия" class="julia-tip-ava" onerror="this.style.display='none'">
                    <div class="julia-tip-bubble">
                        <div class="julia-tip-text">«${r.tip}»</div>
                        <div class="julia-tip-name">— Юлия Воронова</div>
                    </div>
                </div>` : ''}
            </div>`;
        document.getElementById('page-content').innerHTML = html;
    }

    // ── RECIPE PAGE ───────────────────────────────────────────────────────
    let checkedItems = {};

    function isInPlate() {
        return Plate.get().some(item => item.recipeId === r.id);
    }

    function renderRecipe(r) {
        document.title = r.name + ' — Конструктор питания';
        document.getElementById('sticky-add').style.display = 'block';
        const fab = document.getElementById('tawk-fab');
        if (fab) fab.classList.add('above-sticky');

        const diff = DIFF_LABELS[r.diff] || r.diff;
        const catObj = r.cat ? CATEGORIES[r.cat] : null;
        const catColor = catObj ? catObj.color : '#9ab89e';

        const DEFAULT_ADD = {
            protein: [
                { name: 'Нут отварной (3 ст.л.)', kcal: 120, protein: 7, fat: 2, carbs: 18, fiber: 4 },
                { name: 'Тофу (50 г)', kcal: 40, protein: 5, fat: 2, carbs: 1, fiber: 0 },
                { name: 'Красная чечевица (2 ст.л. сухой)', kcal: 110, protein: 8, fat: 0, carbs: 18, fiber: 3 },
            ],
            fat: [
                { name: 'Тыквенные семечки (1 ст.л.)', kcal: 55, protein: 3, fat: 4, carbs: 1, fiber: 0 },
                { name: 'Льняные семечки (1 ч.л.)', kcal: 35, protein: 1, fat: 3, carbs: 2, fiber: 1 },
                { name: 'Авокадо (¼ шт.)', kcal: 80, protein: 1, fat: 7, carbs: 4, fiber: 3 },
            ],
            carbs: [
                { name: 'Цельнозерновой хлеб (1 кусок)', kcal: 80, protein: 3, fat: 1, carbs: 15, fiber: 2 },
                { name: 'Бурый рис (3 ст.л. готового)', kcal: 75, protein: 2, fat: 0, carbs: 16, fiber: 1 },
                { name: 'Гречка отварная (3 ст.л.)', kcal: 80, protein: 3, fat: 1, carbs: 17, fiber: 2 },
            ],
            fiber: [
                { name: 'Свежая зелень — укроп, петрушка (горсть)', kcal: 5, protein: 0, fat: 0, carbs: 1, fiber: 1 },
                { name: 'Листья шпината (горсть)', kcal: 15, protein: 2, fat: 0, carbs: 2, fiber: 2 },
                { name: 'Огурец свежий (½ шт.)', kcal: 10, protein: 0, fat: 0, carbs: 2, fiber: 1 },
            ],
        };
        const addProtein = (r.addProtein && r.addProtein.length) ? r.addProtein : DEFAULT_ADD.protein;
        const addFat     = (r.addFat     && r.addFat.length    ) ? r.addFat     : DEFAULT_ADD.fat;
        const addCarbs   = (r.addCarbs   && r.addCarbs.length  ) ? r.addCarbs   : DEFAULT_ADD.carbs;
        const addFiber   = (r.addFiber   && r.addFiber.length  ) ? r.addFiber   : DEFAULT_ADD.fiber;
        const hasAdditions = !simpleMode;

        const ingHtml = (r.ingredients || []).map((ing, i) => {
            const name = typeof ing === 'string' ? ing : ing.name;
            const swap = typeof ing === 'object' ? ing.swap : null;
            return `<div>
                <div class="ing-item">
                    <div class="ing-dot"></div>
                    <div class="ing-name">${name}</div>
                    ${swap ? `<button class="ing-swap-btn" onclick="toggleSwap(${i})">чем заменить?</button>` : ''}
                </div>
                ${swap ? `<div class="ing-swap-tip" id="swap-${i}">${swap}</div>` : ''}
            </div>`;
        }).join('');

        const stepsHtml = (r.steps || []).map((s, i) => {
            const text  = typeof s === 'string' ? s : s.text;
            const photo = typeof s === 'object' && s.photo ? s.photo : null;
            const photoHtml = photo
                ? (photo === true
                    ? `<div class="step-photo-placeholder"><span>📷</span><span>Фото шага ${i+1}</span></div>`
                    : `<img class="step-photo-img" src="${photo}" alt="Шаг ${i+1}" loading="lazy" onerror="this.style.display='none'">`)
                : '';
            return `<div class="step-item"><div class="step-num">${i+1}</div><div style="flex:1">${text}${photoHtml}</div></div>`;
        }).join('');

        const sidebarHtml = hasAdditions ? `
            <div class="add-sidebar anim anim-d2">
                <div class="add-sidebar-head">
                    <div class="add-sidebar-head-title">🌿 Сбалансируй тарелку</div>
                    <div class="add-sidebar-head-sub">Отметьте что добавите — КБЖУ пересчитается</div>
                </div>
                ${buildGroup('💪 Добавь белка для сытости', 'p', addProtein)}
                ${buildGroup('🥑 Добавь жиров для баланса', 'f', addFat)}
                ${buildGroup('🌾 Добавь углеводов для энергии', 'c', addCarbs)}
                ${buildGroup('🥬 Добавь клетчатки', 'fi', addFiber)}
                <div class="add-total" id="add-total-bar">
                    <div>
                        <div class="add-total-label">Итого (блюдо + добавки):</div>
                        <div class="add-total-macro" id="add-macro">Б${r.protein}г · Ж${r.fat}г · У${r.carbs}г · Кл${r.fiber||0}г</div>
                    </div>
                    <div class="add-total-val" id="add-total-kcal">${r.kcal} ккал</div>
                </div>
            </div>` : '';

        const alreadyInPlate = isInPlate();
        const fiberCell = (r.fiber !== undefined)
            ? `<div class="kbzhu-cell"><div class="kbzhu-val" id="kbzhu-fiber">${r.fiber}г</div><div class="kbzhu-lbl">Клетчатка</div></div>`
            : '';

        const tipHtml = r.tip ? `<div class="julia-tip">
            <img src="../images/YV-small.webp" alt="Юлия" class="julia-tip-ava" onerror="this.style.display='none'">
            <div class="julia-tip-bubble">
                <div class="julia-tip-text">«${r.tip}»</div>
                <div class="julia-tip-name">— Юлия Воронова</div>
            </div>
        </div>` : '';

        // Recipe meta: rating stars + date
        const rv = Ratings.forRecipe(r.id);
        const isFav = Favorites.has(r.id);
        const avgRating = rv.count > 0 ? (rv.sum / rv.count) : 0;
        const avgDisplay = rv.mine || (avgRating > 0 ? avgRating.toFixed(1) : '—');
        const starsRow = [1,2,3,4,5].map(i =>
            `<span class="star r-star${i <= Math.round(rv.mine || avgRating) ? ' filled' : ''}" data-n="${i}"
                onmouseenter="hoverInlineStar(${i})" onmouseleave="unhoverInlineStar()"
                onclick="rateInline(${i})">★</span>`).join('');
        const voterCount = rv.count || 0;
        const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
        let dateStr = '';
        if (r.added) {
            dateStr = r.added;
        }

        document.getElementById('page-content').innerHTML = `
            <div class="recipe-layout">
                <div class="recipe-main anim">
                    <div class="recipe-hero-img">
                        <img src="${r.photo || PHOTO_BY_CAT[r.cat] || PHOTO_FALLBACK}"
                             alt="${r.name}"
                             style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;"
                             onerror="this.style.display='none'">
                        ${!r.photo ? `<div class="recipe-hero-emoji" style="position:relative;font-size:64px;z-index:1;text-shadow:0 2px 8px rgba(0,0,0,.3)">${r.emoji}</div>` : ''}
                        <div class="card-fav-btn${isFav ? ' active' : ''}" id="recipe-fav-btn"
                            onclick="event.stopPropagation();toggleRecipeFav()">
                            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                        </div>
                        <div class="photo-overlay">
                            <div class="photo-rating-pill" id="recipe-rpill"
                                onclick="event.stopPropagation();openRecipeRatingPopup()">
                                <span class="pr-star">★</span>
                                <span class="pr-val" id="recipe-rating-val">${avgDisplay}</span>
                            </div>
                            <button class="photo-comment-btn" onclick="event.stopPropagation();openRecipeComments()">
                                <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                                Отзывы
                            </button>
                        </div>
                        <div class="rating-popup" id="recipe-rpop">
                            ${[1,2,3,4,5].map(i => `<span class="rp-star"
                                onmouseenter="hoverRecipeStar(${i})"
                                onmouseleave="unhoverRecipeStar()"
                                onclick="event.stopPropagation();rateRecipeFromPop(${i})">★</span>`).join('')}
                        </div>
                    </div>
                    <div class="recipe-badges">
                        <span class="recipe-badge">⏱ ${r.time} мин</span>
                        <span class="recipe-badge">⚡ ${diff}</span>
                        <span class="recipe-badge">🍽 ${r.servings || 2} порции <span style="font-weight:400;color:var(--text-3)">(1 порция ≈ ${r.portionGrams || 300} г)</span></span>
                        ${r.added ? `<span class="recipe-badge" style="color:var(--text-3);font-weight:500">Рецепт добавлен: ${r.added}</span>` : ''}
                    </div>
                    <h1 class="recipe-title">${r.name}</h1>
                    <div class="recipe-meta-row" id="recipe-stars-row">
                        <span class="recipe-meta-stars${rv.mine ? ' user-rated' : ''}">
                            ${starsRow}
                            <span style="color:var(--text-3)">(${voterCount})</span>
                        </span>
                    </div>
                    ${r.quote ? `<div class="julia-tip" style="margin-top:0;margin-bottom:18px">
                        <img src="../images/YV-small.webp" alt="Юлия" class="julia-tip-ava" onerror="this.style.display='none'">
                        <div class="julia-tip-bubble">
                            <div class="julia-tip-text">«${r.quote}»</div>
                            <div class="julia-tip-name">— Юлия Воронова</div>
                        </div>
                    </div>` : ''}
                    <div class="v-section-title" style="margin-bottom:8px">В одной порции блюда:</div>
                    <div class="kbzhu" id="kbzhu-block">
                        <div class="kbzhu-cell main"><div class="kbzhu-val" id="kbzhu-kcal">${r.kcal}</div><div class="kbzhu-lbl">Ккал</div></div>
                        <div class="kbzhu-cell"><div class="kbzhu-val" id="kbzhu-protein">${r.protein}г</div><div class="kbzhu-lbl">Белки</div></div>
                        <div class="kbzhu-cell"><div class="kbzhu-val" id="kbzhu-fat">${r.fat}г</div><div class="kbzhu-lbl">Жиры</div></div>
                        <div class="kbzhu-cell"><div class="kbzhu-val" id="kbzhu-carbs">${r.carbs}г</div><div class="kbzhu-lbl">Углеводы</div></div>
                        ${fiberCell}
                    </div>

                    <!-- On mobile: sidebar appears here, right after КБЖУ -->
                    <div id="sidebar-mobile" style="margin-top:16px;display:none"></div>

                    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;margin-bottom:8px">
                        <div class="v-section-title">Ингредиенты</div>
                        <button class="btn btn-ghost btn-sm" onclick="shareRecipeIngredients()" style="padding:6px 10px;font-size:11px">📤 Поделиться</button>
                    </div>
                    <div class="ing-list">${ingHtml}</div>

                    <div class="v-section-title" style="margin-top:20px">Приготовление</div>
                    <div class="steps-list">${stepsHtml}</div>

                    ${!simpleMode && (r.ytVideo || r.vkVideo) ? `
                        <div class="v-section-title" style="margin-top:20px">Видеорецепт</div>
                        <div class="vk-embed" style="cursor:default;background:#000">
                            <iframe
                                src="${r.ytVideo || r.vkVideo}"
                                width="100%" height="100%"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen; screen-wake-lock;"
                                frameborder="0" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"
                                style="position:absolute;inset:0;width:100%;height:100%;border:none;">
                            </iframe>
                        </div>` : ''}

                    ${tipHtml}
                </div>

                <!-- Desktop sidebar -->
                <div class="recipe-sidebar" id="sidebar-desktop">
                    ${sidebarHtml}
                </div>
            </div>`;

        // Mobile: move sidebar DOM nodes (not innerHTML copy) to avoid duplicate IDs
        if (window.innerWidth <= 767) {
            const m = document.getElementById('sidebar-mobile');
            const d = document.getElementById('sidebar-desktop');
            if (m && d && d.firstChild) {
                m.style.display = 'block';
                while (d.firstChild) m.appendChild(d.firstChild);
            }
        }

        // Stars: animate when entering viewport
        const starsRowEl = document.getElementById('recipe-stars-row');
        if (starsRowEl && 'IntersectionObserver' in window) {
            const io = new IntersectionObserver(function(entries) {
                if (entries[0].isIntersecting) {
                    starsRowEl.classList.add('stars-animate');
                    io.disconnect();
                }
            }, { threshold: 0.5 });
            io.observe(starsRowEl);
        }

        // Check if already in plate
        if (alreadyInPlate) {
            const btn = document.getElementById('add-btn');
            if (btn) {
                btn.textContent = '✓ В тарелке';
                btn.disabled = true;
                btn.style.opacity = '0.6';
                btn.style.cursor = 'default';
            }
        }
    }

    // subItemRegistry declared above (before renderRecipe call)

    function buildGroup(label, prefix, items) {
        if (!items || !items.length) return '';
        const cls = GROUP_CLASS[prefix] || '';
        return `<div class="add-group ${cls}">
            <div class="add-group-title">${label}</div>
            <div class="add-group-items">
                ${items.map((item, i) => {
                    const key = prefix + '-' + i;
                    const hasRecipe = item.recipeId;
                    const hasCat = item.catLink;
                    if (hasRecipe) {
                        // Items with recipe: show "добавить в тарелку" button
                        subItemRegistry[key] = item;
                        const subInPlate = Plate.get().some(p => p.recipeId === item.recipeId);
                        return `<div class="add-item" id="ai-${key}" style="position:relative">
                            <div class="add-item-check" id="chk-${key}"></div>
                            <div class="add-item-text">
                                ${item.name}
                                <a class="add-item-recipe-link" onclick="event.stopPropagation();location.href='recipe.html?id=${item.recipeId}&from=${fromCat}'">→ Открыть рецепт</a>
                            </div>
                            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
                                <div class="add-item-kcal">+${item.kcal} ккал</div>
                                <button id="sub-add-${key}" class="btn btn-sm ${subInPlate ? 'btn-ghost' : 'btn-green'}"
                                    style="padding:5px 10px;font-size:10px;${subInPlate ? 'opacity:.6;cursor:default' : ''}"
                                    onclick="addSubToPlate('${key}',event)"
                                    ${subInPlate ? 'disabled' : ''}>
                                    ${subInPlate ? '✓ В тарелке' : '+ В тарелку'}
                                </button>
                            </div>
                        </div>`;
                    } else {
                        // Items without recipe: checkbox behavior
                        return `<button class="add-item" id="ai-${key}" onclick="toggleAddItem('${key}',${item.kcal||0},${item.protein||0},${item.fat||0},${item.carbs||0},${item.fiber||0})" style="position:relative">
                            <div class="add-item-check" id="chk-${key}"></div>
                            <div class="add-item-text">
                                ${item.name}
                                ${hasCat ? `<a class="add-item-recipe-link" onclick="event.stopPropagation();location.href='category.html?cat=${item.catLink}'">→ Выбрать из списка</a>` : ''}
                            </div>
                            <div class="add-item-kcal">+${item.kcal} ккал</div>
                        </button>`;
                    }
                }).join('')}
            </div>
        </div>`;
    }

    function addSubToPlate(key, event) {
        event.stopPropagation();
        const btn = document.getElementById('sub-add-' + key);
        if (btn && btn.disabled) return;
        const item = subItemRegistry[key];
        if (!item) return;
        Plate.add({
            name: item.name,
            emoji: item.emoji || '🍴',
            kcal: item.kcal || 0,
            protein: item.protein || 0,
            fat: item.fat || 0,
            carbs: item.carbs || 0,
            fiber: item.fiber || 0,
            recipeId: item.recipeId,
            ingredients: []
        });
        if (btn) {
            btn.textContent = '✓ В тарелке';
            btn.disabled = true;
            btn.className = 'btn btn-sm btn-ghost';
            btn.style.opacity = '.6';
            btn.style.cursor = 'default';
        }
        updatePlateIcon();
        showToast((item.emoji || '') + ' Добавлено в тарелку!');
    }

    function toggleSwap(i) {
        const el = document.getElementById('swap-' + i);
        if (el) el.classList.toggle('open');
    }

    function toggleAddItem(key, kcal, protein, fat, carbs, fiber) {
        const btn = document.getElementById('ai-' + key);
        if (!btn) return;
        if (checkedItems[key]) {
            delete checkedItems[key];
            btn.classList.remove('checked');
        } else {
            checkedItems[key] = { kcal, protein, fat, carbs, fiber: fiber || 0 };
            btn.classList.add('checked');
        }
        updateAddTotal();
    }

    function updateAddTotal() {
        if (!r) return;
        let total = { kcal: r.kcal, protein: r.protein, fat: r.fat, carbs: r.carbs, fiber: r.fiber || 0 };
        Object.values(checkedItems).forEach(v => {
            total.kcal    += v.kcal    || 0;
            total.protein += v.protein || 0;
            total.fat     += v.fat     || 0;
            total.carbs   += v.carbs   || 0;
            total.fiber   += v.fiber   || 0;
        });
        const tEl = document.getElementById('add-total-kcal');
        const mEl = document.getElementById('add-macro');
        if (tEl) tEl.textContent = total.kcal + ' ккал';
        if (mEl) mEl.textContent = `Б${total.protein}г · Ж${total.fat}г · У${total.carbs}г · Кл${total.fiber}г`;
        // Also update KBZHU block
        const ke = document.getElementById('kbzhu-kcal');
        const kp = document.getElementById('kbzhu-protein');
        const kf = document.getElementById('kbzhu-fat');
        const kc = document.getElementById('kbzhu-carbs');
        const kfi = document.getElementById('kbzhu-fiber');
        if (ke) ke.textContent = total.kcal;
        if (kp) kp.textContent = total.protein + 'г';
        if (kf) kf.textContent = total.fat + 'г';
        if (kc) kc.textContent = total.carbs + 'г';
        if (kfi) kfi.textContent = total.fiber + 'г';
    }

    // ── ADD TO PLATE ──────────────────────────────────────────────────────
    function addToPlate() {
        if (!r) return;
        if (isInPlate()) return;
        let total = { kcal: r.kcal, protein: r.protein, fat: r.fat, carbs: r.carbs, fiber: r.fiber || 0 };
        Object.values(checkedItems).forEach(v => {
            total.kcal    += v.kcal    || 0;
            total.protein += v.protein || 0;
            total.fat     += v.fat     || 0;
            total.carbs   += v.carbs   || 0;
            total.fiber   += v.fiber   || 0;
        });

        const extras = Object.keys(checkedItems).length
            ? ' + ' + Object.keys(checkedItems).length + ' добавок' : '';

        Plate.add({
            name: r.name + extras,
            emoji: r.emoji,
            photo: r.photo || '',
            kcal: total.kcal,
            protein: total.protein,
            fat: total.fat,
            carbs: total.carbs,
            fiber: total.fiber,
            recipeId: r.id,
            ingredients: r.ingredients
        });

        showToast(r.emoji + ' Добавлено в тарелку!');
        const btn = document.getElementById('add-btn');
        if (btn) {
            btn.textContent = '✓ В тарелке';
            btn.disabled = true;
            btn.style.opacity = '0.6';
            btn.style.cursor = 'default';
        }

        setTimeout(() => { history.back(); }, 1000);
    }

    // ── MY PLATE MODAL ────────────────────────────────────────────────────
    function openPlate() {
        const items = Plate.get();
        const body  = document.getElementById('plate-body');
        if (!items.length) {
            body.innerHTML = '<div class="plate-empty"><div class="plate-empty-icon">🍽️</div><div class="plate-empty-text">Тарелка пока пуста</div></div>';
        } else {
            const t = Plate.totals();
            body.innerHTML = '<div class="plate-items">' +
                items.map((item, i) => `<div class="plate-item">
                    ${item.photo
                        ? `<img class="plate-item-photo" src="${item.photo}" alt="">`
                        : `<div class="plate-item-emoji">${item.emoji || '🍴'}</div>`}
                    <div class="plate-item-info">
                        ${item.recipeId
                            ? `<div class="plate-item-name" style="cursor:pointer;color:var(--green-d)" onclick="closePlate();location.href='recipe.html?id=${item.recipeId}&from=plate&simple=1'">${item.name}</div>`
                            : `<div class="plate-item-name">${item.name}</div>`}
                        <div class="plate-item-kcal">${item.kcal} ккал · Б${item.protein}г · Ж${item.fat}г · У${item.carbs}г</div>
                    </div>
                    <button class="plate-item-del" onclick="removeItemR(${i})">✕</button>
                </div>`).join('') + '</div>' +
                `<div class="plate-total-block" style="margin-top:12px">
                    <div class="plate-total-title">Итого</div>
                    <div class="plate-total-val">${t.kcal} ккал | Б: ${t.protein}г | Ж: ${t.fat}г | У: ${t.carbs}г${t.fiber ? ' | Кл: ' + t.fiber + 'г' : ''}</div>
                </div>
                <div style="display:flex;gap:8px;margin-top:10px">
                    <button class="btn btn-orange" style="flex:1" onclick="location.href='index.html'">← Вернуться</button>
                    <button class="btn btn-ghost" style="flex-shrink:0" onclick="shareShoppingList()">📤 Список продуктов</button>
                </div>`;
        }
        document.getElementById('plate-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closePlate() {
        document.getElementById('plate-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }
    function closePlateIfOutside(e) { if (e.target === document.getElementById('plate-overlay')) closePlate(); }
    function removeItemR(i) { Plate.remove(i); updatePlateIcon(); openPlate(); }

    // ── FAV + RATING ON PHOTO ─────────────────────────────────────────────
    function toggleRecipeFav() {
        if (!r) return;
        const isNow = Favorites.toggle(r.id);
        document.getElementById('recipe-fav-btn')?.classList.toggle('active', isNow);
    }

    function openRecipeComments() { openRecipeRatingPopup(); }

    function openRecipeRatingPopup() {
        const pop = document.getElementById('recipe-rpop');
        if (!pop) return;
        const opening = !pop.classList.contains('open');
        pop.classList.toggle('open');
        if (opening) updateRecipePopStars();
    }

    function updateRecipePopStars() {
        const rv = Ratings.forRecipe(r.id);
        const filled = rv.mine || 0;
        document.querySelectorAll('#recipe-rpop .rp-star').forEach((s, i) =>
            s.classList.toggle('filled', i < filled));
    }

    function hoverRecipeStar(n) {
        document.querySelectorAll('#recipe-rpop .rp-star').forEach((s, i) =>
            s.classList.toggle('filled', i < n));
    }

    function unhoverRecipeStar() { updateRecipePopStars(); }

    function rateRecipeFromPop(stars) {
        Ratings.rate(r.id, stars);
        updateRecipePopStars();
        const rv = Ratings.forRecipe(r.id);
        const val = rv.mine || (rv.count > 0 ? (rv.sum / rv.count).toFixed(1) : '—');
        const el = document.getElementById('recipe-rating-val');
        if (el) el.textContent = val;
        document.getElementById('recipe-rpop')?.classList.remove('open');
        const avg = rv.count > 0 ? rv.sum / rv.count : stars;
        document.querySelectorAll('.r-star').forEach((s, i) =>
            s.classList.toggle('filled', i < Math.round(avg)));
        showToast('Оценка сохранена ★');
    }

    // ── INLINE STARS ──────────────────────────────────────────────────────
    function hoverInlineStar(n) {
        document.querySelectorAll('.r-star').forEach((s, i) =>
            s.classList.toggle('filled', i < n));
    }

    function unhoverInlineStar() {
        const rv = Ratings.forRecipe(r.id);
        const avg = rv.mine || (rv.count > 0 ? Math.round(rv.sum / rv.count) : 0);
        document.querySelectorAll('.r-star').forEach((s, i) =>
            s.classList.toggle('filled', i < avg));
    }

    function rateInline(n) {
        if (n < 1) return;
        Ratings.rate(r.id, n);
        const rv = Ratings.forRecipe(r.id);
        const avg = rv.count > 0 ? rv.sum / rv.count : n;
        document.querySelectorAll('.r-star').forEach((s, i) =>
            s.classList.toggle('filled', i < Math.round(avg)));
        const valEl = document.getElementById('recipe-rating-val');
        if (valEl) valEl.textContent = rv.mine;
        // Stop hint animation after rating
        const starsWrap = document.querySelector('.recipe-meta-stars');
        if (starsWrap) starsWrap.classList.add('user-rated');
        updateRecipePopStars();
        showToast('Оценка сохранена ★');
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('#recipe-rpill') && !e.target.closest('#recipe-rpop'))
            document.getElementById('recipe-rpop')?.classList.remove('open');
    });

    function shareRecipeIngredients() {
        if (!r) return;
        let txt = `🛒 ${r.name}\n\n`;
        (r.ingredients || []).forEach(ing => {
            const name = typeof ing === 'string' ? ing : ing.name;
            txt += `• ${name}\n`;
        });
        txt += `\n⏱ ${r.time} мин · ${r.kcal} ккал`;
        if (navigator.share) { navigator.share({ title: r.name, text: txt }).catch(() => {}); }
        else { navigator.clipboard.writeText(txt).then(() => showToast('📋 Скопировано!')).catch(() => showToast('Не удалось скопировать')); }
    }


</script>
