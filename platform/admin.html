<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — Умная тарелка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #e8400a;
            --accent-l: #fff2ed;
            --green: #16a34a;
            --green-l: #f0fdf4;
            --yellow: #ca8a04;
            --yellow-l: #fefce8;
            --red: #dc2626;
            --red-l: #fef2f2;
            --blue: #2563eb;
            --blue-l: #eff6ff;
            --text: #111;
            --text-2: #444;
            --text-3: #777;
            --border: #e5e5e5;
            --bg: #f8f8f8;
            --card: #fff;
        }

        body {
            font-family: 'Montserrat', system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100dvh;
        }

        /* ── Top bar ── */
        .adm-topbar {
            background: var(--card);
            border-bottom: 2px solid var(--accent);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .adm-topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .adm-topbar-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
        }

        .adm-topbar-title span { color: var(--accent); }

        .adm-badge {
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .adm-topbar-user {
            font-size: 13px;
            color: var(--text-2);
        }

        .adm-topbar-logout {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 12px;
        }

        /* ── Tabs ── */
        .adm-tabs {
            display: flex;
            gap: 0;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
        }

        .adm-tab {
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-3);
            cursor: pointer;
            border: none;
            background: none;
            border-bottom: 2px solid transparent;
            transition: all .15s;
        }

        .adm-tab:hover { color: var(--text); }

        .adm-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .adm-tab-badge {
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 6px;
        }

        /* ── Main ── */
        .adm-main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ── Stats cards ── */
        .adm-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .adm-stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .adm-stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px;
        }

        .adm-stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
        }

        .adm-stat-card.accent { border-left: 3px solid var(--accent); }
        .adm-stat-card.green { border-left: 3px solid var(--green); }
        .adm-stat-card.yellow { border-left: 3px solid var(--yellow); }
        .adm-stat-card.red { border-left: 3px solid var(--red); }

        /* ── Section ── */
        .adm-section {
            display: none;
        }

        .adm-section.active { display: block; }

        .adm-section-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* ── Table ── */
        .adm-table-wrap {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .adm-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .adm-table th {
            text-align: left;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text-3);
            background: #fafafa;
            border-bottom: 1px solid var(--border);
        }

        .adm-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .adm-table tr:last-child td { border-bottom: none; }

        .adm-table tr:hover td { background: #fafafa; }

        /* Status badges */
        .st-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .st-trial { background: var(--blue-l); color: var(--blue); }
        .st-active { background: var(--green-l); color: var(--green); }
        .st-expired { background: var(--yellow-l); color: var(--yellow); }
        .st-blocked { background: var(--red-l); color: var(--red); }
        .st-cancelled { background: #f5f5f5; color: var(--text-3); }
        .st-pending { background: var(--yellow-l); color: var(--yellow); }
        .st-confirmed { background: var(--green-l); color: var(--green); }
        .st-rejected { background: var(--red-l); color: var(--red); }

        /* Action buttons */
        .adm-btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all .15s;
        }

        .adm-btn:disabled { opacity: .4; cursor: not-allowed; }

        .adm-btn-confirm {
            background: var(--green);
            color: #fff;
        }

        .adm-btn-confirm:hover:not(:disabled) { background: #15803d; }

        .adm-btn-reject {
            background: var(--red-l);
            color: var(--red);
            margin-left: 6px;
        }

        .adm-btn-reject:hover:not(:disabled) { background: #fecaca; }

        .adm-btn-block {
            background: var(--red-l);
            color: var(--red);
        }

        .adm-btn-block:hover:not(:disabled) { background: #fecaca; }

        .adm-btn-unblock {
            background: var(--green-l);
            color: var(--green);
        }

        .adm-btn-unblock:hover:not(:disabled) { background: #dcfce7; }

        .adm-btn-back {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-2);
            margin-bottom: 16px;
        }

        /* ── Search ── */
        .adm-search {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            width: 100%;
            max-width: 320px;
            margin-bottom: 16px;
            outline: none;
        }

        .adm-search:focus { border-color: var(--accent); }

        /* ── Empty state ── */
        .adm-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
            font-size: 14px;
        }

        /* ── Loading ── */
        .adm-loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-3);
        }

        .adm-spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Modal ── */
        .adm-modal-bg {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .adm-modal-bg.open { display: flex; }

        .adm-modal {
            background: var(--card);
            border-radius: 14px;
            padding: 28px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 8px 40px rgba(0,0,0,.15);
        }

        .adm-modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .adm-modal-field {
            margin-bottom: 14px;
        }

        .adm-modal-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            margin-bottom: 4px;
        }

        .adm-modal-input, .adm-modal-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }

        .adm-modal-input:focus, .adm-modal-select:focus { border-color: var(--accent); }

        .adm-modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .adm-modal-actions .adm-btn { padding: 10px 20px; font-size: 14px; }

        /* ── Toast ── */
        .adm-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 300;
            transition: transform .3s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,.2);
        }

        .adm-toast.show { transform: translateX(-50%) translateY(0); }

        /* ── Date format ── */
        .adm-date { white-space: nowrap; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .adm-main { padding: 16px; }
            .adm-stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .adm-table { font-size: 12px; }
            .adm-table th, .adm-table td { padding: 10px 10px; }
            .adm-tabs { padding: 0 12px; overflow-x: auto; }
            .adm-tab { padding: 12px 14px; font-size: 13px; white-space: nowrap; }
        }

        @media (max-width: 480px) {
            .adm-stats { grid-template-columns: 1fr 1fr; }
            .adm-stat-num { font-size: 26px; }
            .adm-topbar { padding: 12px 16px; }
            .adm-topbar-title { font-size: 17px; }
        }
    </style>
</head>
<body>

<div class="adm-topbar">
    <div class="adm-topbar-left">
        <div class="adm-topbar-title">Умная <span>тарелка</span></div>
        <div class="adm-badge">Admin</div>
    </div>
    <div>
        <span class="adm-topbar-user" id="admin-email"></span>
        <button class="adm-topbar-logout" onclick="doLogout()">Выйти</button>
    </div>
</div>

<div class="adm-tabs">
    <button class="adm-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Дашборд</button>
    <button class="adm-tab" data-tab="users" onclick="switchTab('users')">Пользователи</button>
    <button class="adm-tab" data-tab="payments" onclick="switchTab('payments')">
        Платежи <span class="adm-tab-badge" id="pending-badge" style="display:none">0</span>
    </button>
</div>

<div class="adm-main">

    <!-- Dashboard -->
    <div class="adm-section active" id="sec-dashboard">
        <div class="adm-stats" id="stats-grid">
            <div class="adm-loading"><div class="adm-spinner"></div><br>Загрузка...</div>
        </div>
    </div>

    <!-- Users -->
    <div class="adm-section" id="sec-users">
        <div class="adm-section-title">Пользователи</div>
        <input type="text" class="adm-search" id="user-search" placeholder="Поиск по email или имени..." oninput="filterUsers()">
        <div class="adm-table-wrap">
            <table class="adm-table">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Имя</th>
                        <th>Подписка</th>
                        <th>До</th>
                        <th>Регистрация</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="6" class="adm-loading"><div class="adm-spinner"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Payments -->
    <div class="adm-section" id="sec-payments">
        <div class="adm-section-title">Платежи</div>
        <div style="margin-bottom:16px">
            <button class="adm-btn" style="margin-right:4px" onclick="loadPayments('pending')" id="pay-filter-pending">Ожидающие</button>
            <button class="adm-btn" onclick="loadPayments('confirmed')" id="pay-filter-confirmed">Подтверждённые</button>
            <button class="adm-btn" onclick="loadPayments('rejected')" id="pay-filter-rejected">Отклонённые</button>
        </div>
        <div class="adm-table-wrap">
            <table class="adm-table">
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Сумма</th>
                        <th>Карта</th>
                        <th>Дата перевода</th>
                        <th>Статус</th>
                        <th>Создан</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="payments-tbody">
                    <tr><td colspan="7" class="adm-empty">Нет платежей</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Confirm payment modal -->
<div class="adm-modal-bg" id="confirm-modal">
    <div class="adm-modal">
        <div class="adm-modal-title">Подтвердить оплату</div>
        <div class="adm-modal-field">
            <label class="adm-modal-label">Продлить на</label>
            <select class="adm-modal-select" id="confirm-months">
                <option value="1">1 месяц (30 дней)</option>
                <option value="3">3 месяца (90 дней)</option>
                <option value="6">6 месяцев (180 дней)</option>
                <option value="12">12 месяцев (360 дней)</option>
            </select>
        </div>
        <div class="adm-modal-field">
            <label class="adm-modal-label">Комментарий (необязательно)</label>
            <input type="text" class="adm-modal-input" id="confirm-comment" placeholder="Оплата по переводу...">
        </div>
        <div class="adm-modal-actions">
            <button class="adm-btn adm-btn-reject" onclick="closeModal()">Отмена</button>
            <button class="adm-btn adm-btn-confirm" id="confirm-submit-btn" onclick="submitConfirm()">Подтвердить</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="adm-toast" id="adm-toast"></div>

<script src="data-v2.js?v=1774300001"></script>
<script>
(function() {
    // ── Auth check ──
    if (!Auth.isLoggedIn()) { location.href = 'login.html'; return; }
    var user = Auth.getUser();
    document.getElementById('admin-email').textContent = user.email || '';

    var allUsers = [];
    var confirmPaymentId = null;

    // ── API helper ──
    function api(path, opts) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + Auth.getToken();
        if (opts.body && typeof opts.body === 'object') {
            opts.headers['Content-Type'] = 'application/json';
            opts.body = JSON.stringify(opts.body);
        }
        return fetch(API_BASE + path, opts).then(function(res) {
            if (res.status === 401) { location.href = 'login.html'; }
            if (res.status === 403) { showToast('Нет прав администратора'); throw new Error('403'); }
            return res.json();
        });
    }

    // ── Tabs ──
    window.switchTab = function(tab) {
        document.querySelectorAll('.adm-tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
        document.querySelectorAll('.adm-section').forEach(function(s) { s.classList.remove('active'); });
        document.getElementById('sec-' + tab).classList.add('active');

        if (tab === 'users' && !allUsers.length) loadUsers();
        if (tab === 'payments') loadPayments('pending');
    };

    // ── Stats ──
    function loadStats() {
        api('/admin/stats').then(function(data) {
            var grid = document.getElementById('stats-grid');
            grid.innerHTML =
                statCard('Всего', data.totalUsers, 'accent') +
                statCard('Trial', data.trials, 'blue-l') +
                statCard('Активных', data.active, 'green') +
                statCard('Истекших', data.expired, 'yellow') +
                statCard('Ожидают оплату', data.pendingPayments, 'red');

            var badge = document.getElementById('pending-badge');
            if (data.pendingPayments > 0) {
                badge.textContent = data.pendingPayments;
                badge.style.display = 'inline';
            }
        }).catch(function() {
            document.getElementById('stats-grid').innerHTML = '<div class="adm-empty">Ошибка загрузки. Проверьте, что у вас роль admin.</div>';
        });
    }

    function statCard(label, num, colorClass) {
        return '<div class="adm-stat-card ' + colorClass + '">' +
            '<div class="adm-stat-label">' + label + '</div>' +
            '<div class="adm-stat-num">' + num + '</div></div>';
    }

    // ── Users ──
    function loadUsers() {
        api('/admin/users').then(function(data) {
            allUsers = data;
            renderUsers(data);
        });
    }
    window.loadUsers = loadUsers;

    function renderUsers(users) {
        var tbody = document.getElementById('users-tbody');
        if (!users.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="adm-empty">Нет пользователей</td></tr>';
            return;
        }
        tbody.innerHTML = users.map(function(u) {
            var status = u.sub_status || 'нет';
            var statusClass = 'st-' + status;
            var untilDate = '';
            if (u.sub_status === 'trial' && u.trial_ends_at) untilDate = fmtDate(u.trial_ends_at);
            else if (u.sub_status === 'active' && u.active_until) untilDate = fmtDate(u.active_until);

            var actions = '';
            if (u.is_blocked) {
                actions = '<button class="adm-btn adm-btn-unblock" onclick="unblockUser(\'' + u.id + '\')">Разблокировать</button>';
            } else if (u.role !== 'admin') {
                actions = '<button class="adm-btn adm-btn-block" onclick="blockUser(\'' + u.id + '\',\'' + esc(u.email) + '\')">Блок</button>';
            } else {
                actions = '<span style="color:var(--text-3);font-size:12px">admin</span>';
            }

            return '<tr>' +
                '<td><strong>' + esc(u.email || '—') + '</strong></td>' +
                '<td>' + esc(u.display_name || '—') + '</td>' +
                '<td><span class="st-badge ' + statusClass + '">' + status + '</span></td>' +
                '<td class="adm-date">' + untilDate + '</td>' +
                '<td class="adm-date">' + fmtDate(u.created_at) + '</td>' +
                '<td>' + actions + '</td>' +
                '</tr>';
        }).join('');
    }

    window.filterUsers = function() {
        var q = document.getElementById('user-search').value.toLowerCase();
        if (!q) { renderUsers(allUsers); return; }
        renderUsers(allUsers.filter(function(u) {
            return (u.email && u.email.toLowerCase().includes(q)) ||
                   (u.display_name && u.display_name.toLowerCase().includes(q));
        }));
    };

    window.blockUser = function(id, email) {
        if (!confirm('Заблокировать ' + email + '?')) return;
        api('/admin/users/' + id + '/block', { method: 'POST' }).then(function() {
            showToast('Пользователь заблокирован');
            loadUsers();
            loadStats();
        });
    };

    window.unblockUser = function(id) {
        api('/admin/users/' + id + '/unblock', { method: 'POST' }).then(function() {
            showToast('Пользователь разблокирован');
            loadUsers();
            loadStats();
        });
    };

    // ── Payments ──
    window.loadPayments = function(status) {
        document.querySelectorAll('[id^="pay-filter-"]').forEach(function(b) {
            b.style.background = b.id === 'pay-filter-' + status ? 'var(--accent)' : '';
            b.style.color = b.id === 'pay-filter-' + status ? '#fff' : '';
        });

        api('/admin/payments?status=' + status).then(function(data) {
            var tbody = document.getElementById('payments-tbody');
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="adm-empty">Нет платежей со статусом "' + status + '"</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(function(p) {
                var statusBadge = '<span class="st-badge st-' + p.status + '">' + p.status + '</span>';
                var actions = '';
                if (p.status === 'pending') {
                    actions =
                        '<button class="adm-btn adm-btn-confirm" onclick="openConfirm(\'' + p.id + '\')">OK</button>' +
                        '<button class="adm-btn adm-btn-reject" onclick="rejectPayment(\'' + p.id + '\')">X</button>';
                } else if (p.admin_comment) {
                    actions = '<span style="font-size:11px;color:var(--text-3)">' + esc(p.admin_comment) + '</span>';
                }

                return '<tr>' +
                    '<td><strong>' + esc(p.email) + '</strong></td>' +
                    '<td>' + (p.amount / 100) + ' &#8381;</td>' +
                    '<td>' + (p.card_last4 || '—') + '</td>' +
                    '<td class="adm-date">' + (p.transfer_date ? fmtDate(p.transfer_date) : '—') + '</td>' +
                    '<td>' + statusBadge + '</td>' +
                    '<td class="adm-date">' + fmtDate(p.created_at) + '</td>' +
                    '<td>' + actions + '</td>' +
                    '</tr>';
            }).join('');
        });
    };

    window.openConfirm = function(paymentId) {
        confirmPaymentId = paymentId;
        document.getElementById('confirm-months').value = '1';
        document.getElementById('confirm-comment').value = '';
        document.getElementById('confirm-modal').classList.add('open');
    };

    window.closeModal = function() {
        document.getElementById('confirm-modal').classList.remove('open');
        confirmPaymentId = null;
    };

    window.submitConfirm = function() {
        if (!confirmPaymentId) return;
        var months = Number(document.getElementById('confirm-months').value);
        var comment = document.getElementById('confirm-comment').value;
        var btn = document.getElementById('confirm-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Отправка...';
        api('/admin/payments/' + confirmPaymentId + '/confirm', {
            method: 'POST',
            body: { months: months, comment: comment }
        }).then(function(data) {
            showToast(data.message || 'Подтверждено');
            closeModal();
            loadPayments('pending');
            loadStats();
        }).catch(function() {
            showToast('Ошибка');
        }).finally(function() {
            btn.disabled = false;
            btn.textContent = 'Подтвердить';
        });
    };

    window.rejectPayment = function(id) {
        if (!confirm('Отклонить платёж?')) return;
        var comment = prompt('Причина (необязательно):', '');
        api('/admin/payments/' + id + '/reject', {
            method: 'POST',
            body: { comment: comment || 'Отклонено' }
        }).then(function() {
            showToast('Платёж отклонён');
            loadPayments('pending');
            loadStats();
        });
    };

    // ── Helpers ──
    function fmtDate(d) {
        if (!d) return '—';
        var date = new Date(d);
        return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    }

    function esc(s) {
        if (!s) return '';
        var el = document.createElement('span');
        el.textContent = s;
        return el.innerHTML;
    }

    function showToast(msg) {
        var toast = document.getElementById('adm-toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    window.doLogout = function() {
        Auth.logout();
        location.href = 'login.html';
    };

    // ── Init ──
    loadStats();
})();
</script>
</body>
</html>
