<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категория — Конструктор питания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700;800&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
    <style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="style-v4.css" id="vcss"><script>document.getElementById('vcss').href='style-v4.css?v='+Date.now()</script>
    <style>
        .cat-hero { padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .cat-hero-row { display: flex; align-items: center; gap: 16px; }
        .cat-hero-ava {
            width: 72px; height: 72px; border-radius: 50%;
            object-fit: cover; flex-shrink: 0;
            border: 2px solid var(--border);
            background: var(--bg-alt);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; overflow: hidden;
        }
        .cat-hero-ava img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .cat-hero-name { font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--text); line-height: 1.1; }
        .cat-hero-desc { font-size: 13px; color: var(--text-2); margin-top: 3px; }
    </style>
</head>
<body class="v-page">

<!-- HEADER -->
<header class="v-header" id="hdr">
    <div class="v-wrap">
        <div class="vh-inner">
            <button class="vh-back-btn" onclick="location.href='index.html'" aria-label="Назад">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <a href="index.html" class="vh-brand">
                <span class="vh-brand-meta">
                    <span class="vh-brand-name">Юлия Воронова</span>
                    <span class="vh-brand-role">нутрициолог</span>
                </span>
                <span class="vh-brand-title">Умная <span class="vh-accent">тарелка</span></span>
            </a>
            <div class="vh-slogan-wrap">
                <span class="vh-slogan">Персональный помощник в сбалансированном питании</span>
            </div>
            <div class="v-user-wrap" id="user-wrap">
                <button class="vh-profile-pill" id="user-badge" onclick="toggleUserMenu(event)" type="button">
                    <div class="v-user-avatar" id="u-ava" style="width:34px;height:34px;overflow:hidden;flex-shrink:0;border-radius:50%">?</div>
                    <span class="vh-profile-name" id="u-name">Войти</span>
                </button>
                <div class="user-dropdown" id="user-dropdown">
                    <a href="cabinet.html" class="user-dd-item">👤 Мой кабинет</a>
                    <div class="user-dd-sep"></div>
                    <button class="user-dd-item user-dd-logout" onclick="doLogout()">🚪 Выйти</button>
                </div>
            </div>
            <button class="vh-plate-btn" onclick="openPlate()" type="button" aria-label="Моя тарелка">
                <span class="vh-plate-icon" style="position:relative;width:25px;height:25px;display:inline-block;overflow:hidden;border-radius:50%;flex-shrink:0">
                    <span class="vh-slice vh-slice-g"></span>
                    <span class="vh-slice vh-slice-y"></span>
                    <span class="vh-slice vh-slice-r"></span>
                </span>
                <span class="plate-count" style="display:none">0</span>
            </button>
        </div>
    </div>
</header>

<main style="flex:1; padding-bottom: 40px;">
    <div class="v-wrap">

        <!-- Category hero -->
        <div class="cat-hero anim" id="cat-hero"></div>

        <!-- Filters -->
        <div class="filter-outer anim anim-d1">
        <div class="filter-scroll-wrap">
        <div class="filter-bar" id="filter-row">
            <button class="fgroup-btn" id="fg-time-btn" data-label="Время" data-drop="fg-time-drop" onclick="toggleFGroup(this)">
                <span class="fg-label">Время</span>
                <svg class="fg-arrow" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l4 4 4-4"/></svg>
            </button>
            <button class="fgroup-btn" id="fg-diff-btn" data-label="Сложность" data-drop="fg-diff-drop" onclick="toggleFGroup(this)">
                <span class="fg-label">Сложность</span>
                <svg class="fg-arrow" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l4 4 4-4"/></svg>
            </button>
            <div class="filter-sep"></div>
            <button class="filter-chip" data-f="popular" onclick="togglePopular(this)">⭐ Популярные</button>
            <button class="filter-chip" data-f="gluten" onclick="toggleTagFilter(this)">Без глютена</button>
            <button class="filter-chip" data-f="plant" onclick="toggleTagFilter(this)">Растительные</button>
            <button class="filter-chip" data-f="fish" onclick="toggleTagFilter(this)">Рыбные</button>
            <button class="filter-chip" data-f="noSoy" onclick="toggleTagFilter(this)">Без сои</button>
            <button class="filter-chip" data-f="legumes" onclick="toggleTagFilter(this)">Бобовые</button>
        </div>
        </div>
        <button class="filter-clear" onclick="clearFilters()">↺ Сбросить</button>
        </div>

        <!-- Dish list -->
        <div style="border-top:1px solid var(--border);margin:20px 0 0;padding-top:20px;display:flex;align-items:center;justify-content:space-between">
            <div class="v-sec-title anim anim-d1" id="count-label" style="font-size:13px;color:var(--text-3);font-weight:600"></div>
        </div>
        <div class="recipe-card-grid anim anim-d1" id="dish-list" style="margin-top:16px"></div>
    </div>
</main>

<!-- COMMENTS MODAL -->
<div class="modal-overlay" id="comments-overlay" onclick="closeCommentsIfOutside(event)">
    <div class="modal-box" id="comments-modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <div class="modal-title" id="comments-title">💬 Отзывы</div>
            <button class="modal-close" onclick="closeComments()">✕</button>
        </div>
        <div class="modal-body" id="comments-body"></div>
    </div>
</div>

<!-- MY PLATE MODAL -->
<div class="modal-overlay" id="plate-overlay" onclick="closePlateIfOutside(event)">
    <div class="modal-box" id="plate-modal">
        <div class="modal-handle"></div>
        <div class="modal-header">
            <div class="modal-title"><span class="modal-plate-icon"><span class="vh-slice vh-slice-g"></span><span class="vh-slice vh-slice-y"></span><span class="vh-slice vh-slice-r"></span></span> Моя тарелка</div>
            <button class="modal-close" onclick="closePlate()">✕</button>
        </div>
        <div class="modal-body" id="plate-body"></div>
    </div>
</div>

<!-- FILTER DROPDOWNS (at body level — avoids overflow/transform clipping) -->
<div class="fgroup-drop" id="fg-time-drop">
    <button class="filter-chip" data-f="time" data-v="30" onclick="pickFilter(this,'fg-time-btn')">До 30 мин</button>
    <button class="filter-chip" data-f="time" data-v="60" onclick="pickFilter(this,'fg-time-btn')">До 1 часа</button>
    <button class="filter-chip" data-f="time" data-v="over60" onclick="pickFilter(this,'fg-time-btn')">Более 1 часа</button>
</div>
<div class="fgroup-drop" id="fg-diff-drop">
    <button class="filter-chip" data-f="difficulty" data-v="easy" onclick="pickFilter(this,'fg-diff-btn')">Легкая</button>
    <button class="filter-chip" data-f="difficulty" data-v="medium" onclick="pickFilter(this,'fg-diff-btn')">Средняя</button>
    <button class="filter-chip" data-f="difficulty" data-v="hard" onclick="pickFilter(this,'fg-diff-btn')">Сложная</button>
</div>

<!-- CHAT FAB -->
<button class="chat-fab" id="tawk-fab" onclick="openTawk()" title="Чат с отделом заботы">
    <svg class="chat-fab-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
</button>

<script src="data-v2.js?v=1774941737"></script>
<script>
    Auth.requireAuth();
    loadContent().then(function() {
        if (isContentError()) {
            showApiError(document.getElementById('dish-list'));
            return;
        }
        cat = getCategory(catId);
        if (cat) {
            document.title = cat.name + ' — Конструктор питания';
            var catAvatars = typeof CAT_AVATARS !== 'undefined' ? CAT_AVATARS : {};
            var avaImg = catAvatars[catId]
                ? '<div class="cat-hero-ava"><img src="' + escHtml(String(catAvatars[catId])) + '" alt="' + escHtml(String(cat.name)) + '" onerror="this.parentElement.textContent=\'' + escHtml(String(cat.emoji)) + '\'"></div>'
                : '<div class="cat-hero-ava">' + escHtml(String(cat.emoji)) + '</div>';
            document.getElementById('cat-hero').innerHTML =
                '<div class="cat-hero-row">' + avaImg +
                '<div><div class="cat-hero-name">' + escHtml(String(cat.name)) + '</div>' +
                '<div class="cat-hero-desc">' + escHtml(String(cat.desc)) + '</div></div></div>';
        }
        Auth.checkAccess().then(function() { Favorites.load().then(function() { if (typeof renderDishes === 'function') renderDishes(); }); Plate.load(); });
    });
    updatePlateIcon();

    // User pill init
    (function() {
        const user = Auth.getUser();
        if (!user) return;
        const customName = Auth.getDisplayName();
        const displayName = customName || user.email.split('@')[0];
        const uAva = document.getElementById('u-ava');
        const savedAva = localStorage.getItem(Auth._userKey('user_avatar'));
        if (savedAva) {
            uAva.innerHTML = `<img src="${savedAva}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        } else {
            uAva.textContent = (customName || user.email || '?').charAt(0).toUpperCase();
        }
        document.getElementById('u-name').textContent = displayName;
    })();

    function toggleUserMenu(e) {
        e.stopPropagation();
        document.getElementById('user-dropdown').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
        const wrap = document.getElementById('user-wrap');
        if (wrap && !wrap.contains(e.target)) document.getElementById('user-dropdown').classList.remove('open');
    });
    function doLogout() {
        document.getElementById('user-dropdown').classList.remove('open');
        const overlay = document.createElement('div');
        overlay.className = 'farewell-overlay';
        overlay.innerHTML = '<div class="farewell-emoji">👋</div><div class="farewell-text">До встречи!</div><div class="farewell-sub">Возвращайтесь — мы ждём вас</div>';
        document.body.appendChild(overlay);
        requestAnimationFrame(() => overlay.classList.add('show'));
        setTimeout(() => { Auth.logout(); location.href = 'login.html'; }, 1800);
    }

    const params = new URLSearchParams(location.search);
    const catId = params.get('cat') || 'breakfasts';
    let cat = null;
    const activeFilters = {};

    // Restore filters from index.html navigation
    (function restoreFilters() {
        const saved = sessionStorage.getItem('platform_filters');
        if (!saved) return;
        sessionStorage.removeItem('platform_filters');
        try {
            const f = JSON.parse(saved);
            Object.assign(activeFilters, f);
        } catch(e) { return; }
    })();

    const CAT_PHOTOS = {
        breakfasts: SITE_BASE + '/images/blog/random-pic-blog-5..webp',
        mains:      SITE_BASE + '/images/cook-healthy-food.webp',
        pancakes:   SITE_BASE + '/images/blog/random-pic-blog-2.webp',
        spreads:    SITE_BASE + '/images/blog/random-pic-blog-3.webp',
        salads:     SITE_BASE + '/images/blog/random-pic-blog-4.webp',
        drinks:     SITE_BASE + '/images/blog/random-pic-blog-1.webp',
    };

    window.addEventListener('scroll', () =>
        document.getElementById('hdr').classList.toggle('scrolled', scrollY > 10));

    const CAT_AVATARS = {
        breakfasts: SITE_BASE + '/images/blog/random-pic-blog-5..webp',
        mains:      SITE_BASE + '/images/cook-healthy-food.webp',
        pancakes:   SITE_BASE + '/images/blog/random-pic-blog-2.webp',
        spreads:    SITE_BASE + '/images/blog/random-pic-blog-3.webp',
        salads:     SITE_BASE + '/images/blog/random-pic-blog-4.webp',
        drinks:     SITE_BASE + '/images/blog/random-pic-blog-1.webp',
    };

    // Hero block rendered after loadContent() — see above

    function imgFallback(img, emoji) {
        img.onerror = null;
        img.style.display = 'none';
        var d = document.createElement('div');
        d.className = 'recipe-card-emoji';
        d.textContent = emoji;
        img.parentElement.insertBefore(d, img);
    }

    function ratingPillHtml(recipeId) {
        // Show '—' initially; loadApiRatings() will update with real server data
        const display = '—';
        return `<div class="photo-rating-pill" id="rpill-${recipeId}" role="button"
            onclick="event.stopPropagation();openRatingPopup('${recipeId}',this)">
            <span class="pr-star">★</span>
            <span class="pr-val">${display}</span>
        </div>`;
    }

    function commentBtnHtml(recipeId) {
        return `<div class="photo-comment-btn" id="cbtn-${recipeId}" role="button"
            onclick="event.stopPropagation();openComments('${recipeId}')">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            Отзыв</div>`;
    }

    function pluralR(n) {
        const m10 = n % 10, m100 = n % 100;
        if (m100 >= 11 && m100 <= 14) return n + ' рецептов';
        if (m10 === 1) return n + ' рецепт';
        if (m10 >= 2 && m10 <= 4) return n + ' рецепта';
        return n + ' рецептов';
    }

    function renderDishes() {
        const dishes = getCategoryDishes(catId, activeFilters);
        document.getElementById('count-label').textContent = pluralR(dishes.length);
        if (!dishes.length) {
            document.getElementById('dish-list').innerHTML =
                '<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-3)">Ничего не найдено. Измените фильтры.</div>';
            return;
        }
        const photo = CAT_PHOTOS[catId] || '';
        const diff_labels = typeof DIFF_LABELS !== 'undefined' ? DIFF_LABELS : {};
        document.getElementById('dish-list').innerHTML = dishes.map(d => {
            const _id = encodeURIComponent(d.id);
            const _name = escHtml(String(d.name || ''));
            const _emoji = escHtml(String(d.emoji || '🍴'));
            const _photo = escHtml(String(d.photo || photo || ''));
            const _imgPos = escHtml(String(d.imgPosition || ''));
            const _diff = escHtml(String(diff_labels[d.diff] || d.diff || ''));
            const _time = Number(d.time) || 0;
            const _kcal = Number(d.kcal) || 0;
            const isSublist = d.isSublist;
            const locked = Auth.isTrial() && !d.free;
            const photoHtml = _photo
                ? `<img src="${_photo}" alt="${_name}" loading="lazy" onerror="imgFallback(this,'${_emoji}')"${_imgPos ? ` style="object-position:${_imgPos}"` : ''}>`
                : `<div class="recipe-card-emoji">${_emoji}</div>`;
            const isFav = Favorites.has(d.id);
            const lockBadge = locked ? '<div class="locked-badge"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>Pro</div>' : '';
            const trialBadge = !locked && d.free && Auth.isTrial() ? '<div class="trial-badge">Trial</div>' : '';
            return `<button class="recipe-card${locked ? ' locked' : ''}" onclick="${locked ? 'showLockedMsg()' : "goToRecipe('" + _id + "')"}">
                <div class="recipe-card-photo" style="position:relative">
                    ${photoHtml}
                    ${lockBadge}${trialBadge}
                    ${locked ? '' : `<div class="card-fav-btn${isFav ? ' active' : ''}" id="fav-${_id}"
                        onclick="event.stopPropagation();toggleFav('${_id}')">
                        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                    </div>`}
                    <div class="photo-overlay">
                        ${ratingPillHtml(d.id)}
                        ${commentBtnHtml(d.id)}
                    </div>
                    <div class="rating-popup" id="rpop-${_id}">
                        ${[1,2,3,4,5].map(i => `<span class="rp-star" data-n="${i}"
                            onmouseenter="hoverPopStar('${_id}',${i})"
                            onmouseleave="unhoverPopStar('${_id}')"
                            onclick="event.stopPropagation();rateFromPop('${_id}',${i})">★</span>`).join('')}

        dishes.forEach(d => updatePopStars(d.id));
    }
    // Initial render deferred to loadContent().then() — show loader until data is ready
    document.getElementById('dish-list').innerHTML =
        '<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-3)">Загрузка рецептов…</div>';

    // ── LOAD API RATINGS for Popular filter + accurate pills ────────────
    const _apiRatings = {}; // recipeId → { avg, count }
    let _popularActive = false;

    (async function loadApiRatings() {
        try {
            const res = await fetch(API_BASE + '/content/ratings');
            if (!res.ok) return;
            const data = await res.json();
            Object.assign(_apiRatings, data);
            // Update rating pills with server data
            Object.entries(_apiRatings).forEach(([rid, r]) => {
                const pill = document.getElementById('rpill-' + rid);
                if (pill) pill.querySelector('.pr-val').textContent = r.avg > 0 ? r.avg : '—';
            });
        } catch(e) { console.error('Ratings load error:', e); }
    })();

    function togglePopular(el) {
        _popularActive = !_popularActive;
        el.classList.toggle('on', _popularActive);
        renderDishes();
    }

    // Patch renderDishes to support popular sort
    const _origRenderDishes = renderDishes;
    renderDishes = function() {
        if (_popularActive) {
            const dishes = getCategoryDishes(catId, activeFilters);
            dishes.sort((a, b) => {
                const ra = _apiRatings[a.id] || { avg: 0, count: 0 };
                const rb = _apiRatings[b.id] || { avg: 0, count: 0 };
                if (rb.avg !== ra.avg) return rb.avg - ra.avg;
                return rb.count - ra.count;
            });
            // Render sorted list (copy logic from original but with pre-sorted dishes)
            document.getElementById('count-label').textContent = pluralR(dishes.length);
            if (!dishes.length) {
                document.getElementById('dish-list').innerHTML =
                    '<div style="grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-3)">Ничего не найдено. Измените фильтры.</div>';

            const diff_labels = typeof DIFF_LABELS !== 'undefined' ? DIFF_LABELS : {};
            document.getElementById('dish-list').innerHTML = dishes.map(d => {
                const _id = encodeURIComponent(d.id);
                const _name = escHtml(String(d.name || ''));
                const _emoji = escHtml(String(d.emoji || '🍴'));
                const _photo = escHtml(String(d.photo || photo || ''));
                const _imgPos = escHtml(String(d.imgPosition || ''));
                const _diff = escHtml(String(diff_labels[d.diff] || d.diff || ''));
                const _time = Number(d.time) || 0;
                const _kcal = Number(d.kcal) || 0;
                const isSublist = d.isSublist;

                const photoHtml = _photo
                    ? `<img src="${_photo}" alt="${_name}" loading="lazy" onerror="imgFallback(this,'${_emoji}')"${_imgPos ? ` style="object-position:${_imgPos}"` : ''}>`
                    : `<div class="recipe-card-emoji">${_emoji}</div>`;
                const isFav = Favorites.has(d.id);
                const lockBadge = locked ? '<div class="locked-badge"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>Pro</div>' : '';
                const trialBadge = !locked && d.free && Auth.isTrial() ? '<div class="trial-badge">Trial</div>' : '';
                return `<button class="recipe-card${locked ? ' locked' : ''}" onclick="${locked ? 'showLockedMsg()' : "goToRecipe('" + _id + "')"}">
                    <div class="recipe-card-photo" style="position:relative">
                        ${photoHtml}
                        ${lockBadge}${trialBadge}
                        ${locked ? '' : `<div class="card-fav-btn${isFav ? ' active' : ''}" id="fav-${_id}"
                            onclick="event.stopPropagation();toggleFav('${_id}')">
                            <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                        </div>`}
                        <div class="photo-overlay">
                            ${ratingPillHtml(d.id)}
                            ${commentBtnHtml(d.id)}
                        </div>
                        <div class="rating-popup" id="rpop-${_id}">
                            ${[1,2,3,4,5].map(i => `<span class="rp-star" data-n="${i}"
                                onmouseenter="hoverPopStar('${_id}',${i})"
                                onmouseleave="unhoverPopStar('${_id}')"
                                onclick="event.stopPropagation();rateFromPop('${_id}',${i})">★</span>`).join('')}
                        </div>
                    </div>
                    <div class="recipe-card-body">
                        <div class="recipe-card-name">${_name}${isSublist ? ' <span class="dish-sublist-badge">Список →</span>' : ''}</div>
                        <div class="recipe-card-meta">
                            <span class="pill">⏱ ${_time} мин</span>
                            <span class="pill">${_diff}</span>
                        </div>
                        <div class="recipe-card-kcal" style="margin-top:4px">${_kcal} ккал</div>
                    </div>
                </button>`;
            }).join('');
            dishes.forEach(d => updatePopStars(d.id));
        } else {
            _origRenderDishes();
        }
    };

    // Restore filter UI (chips + dropdown labels) if filters were loaded from sessionStorage
    (function syncFilterUI() {
        const tagFilters = ['gluten','plant','fish','noSoy','legumes'];
        tagFilters.forEach(function(f) {
            if (activeFilters[f]) {
                const chip = document.querySelector(`.filter-chip[data-f="${f}"]`);
                if (chip) chip.classList.add('on');
            }
        });
        ['time','difficulty'].forEach(function(f) {
            if (activeFilters[f] !== undefined) {
                const v = String(activeFilters[f]);
                const chip = document.querySelector(`.fgroup-drop .filter-chip[data-f="${f}"][data-v="${v}"]`);
                if (!chip) return;
                chip.classList.add('on');
                const btnId = f === 'time' ? 'fg-time-btn' : 'fg-diff-btn';
                const btn = document.getElementById(btnId);
                if (btn) {
                    btn.classList.add('has-value');
                    btn.querySelector('.fg-label').textContent = chip.textContent.trim();
                }
            }
        });
    })();

    function goToRecipe(id) {
        location.href = `recipe.html?id=${id}&from=${catId}`;
    }

    function showLockedMsg() {
        const existing = document.getElementById('locked-toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.id = 'locked-toast';
        toast.innerHTML = 'Этот рецепт доступен по подписке. <a href="cabinet.html" style="color:#fff;text-decoration:underline">Оформить</a>';
        Object.assign(toast.style, { position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)', background:'#333', color:'#fff', padding:'12px 20px', borderRadius:'12px', fontSize:'14px', zIndex:'9999', textAlign:'center', maxWidth:'320px' });
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    function toggleFav(id) {
        const isNowFav = Favorites.toggle(id);
        const btn = document.getElementById('fav-' + id);
        if (btn) btn.classList.toggle('active', isNowFav);
    }

    // ── RATING POPUP ─────────────────────────────────────────────────────────
    let activePopId = null;
    function openRatingPopup(recipeId, pillEl) {
        if (activePopId && activePopId !== recipeId) {
            document.getElementById('rpop-' + activePopId)?.classList.remove('open');
        }
        const pop = document.getElementById('rpop-' + recipeId);
        if (!pop) return;
        pop.classList.toggle('open');
        activePopId = pop.classList.contains('open') ? recipeId : null;
    }
    document.addEventListener('click', () => {
        if (activePopId) {
            document.getElementById('rpop-' + activePopId)?.classList.remove('open');
            activePopId = null;
        }
    });

    function updatePopStars(recipeId) {
        const ar = _apiRatings[recipeId];
        const filled = ar ? Math.round(ar.avg) : 0;
        document.querySelectorAll(`#rpop-${recipeId} .rp-star`).forEach((s, i) =>
            s.classList.toggle('filled', i < filled));
    }
    function hoverPopStar(recipeId, n) {
        document.querySelectorAll(`#rpop-${recipeId} .rp-star`).forEach((s, i) =>
            s.classList.toggle('filled', i < n));
    }
    function unhoverPopStar(recipeId) { updatePopStars(recipeId); }
    async function rateFromPop(recipeId, stars) {
        document.getElementById('rpop-' + recipeId)?.classList.remove('open');
        activePopId = null;
        // Отправить оценку на сервер
        try {
            const res = await Auth.api('/content/reviews', {
                method: 'POST',
                body: JSON.stringify({ recipe_id: recipeId, stars, text: '' })
            });
            if (res.ok) {
                showToast('Оценка сохранена ★');
                // Обновить рейтинги с сервера (источник истины)
                try {
                    const rr = await fetch(API_BASE + '/content/ratings');
                    if (rr.ok) {
                        const data = await rr.json();
                        Object.assign(_apiRatings, data);
                        updatePopStars(recipeId);
                        const pill = document.getElementById('rpill-' + recipeId);
                        if (pill) {
                            const ar = _apiRatings[recipeId];
                            pill.querySelector('.pr-val').textContent = ar && ar.avg > 0 ? ar.avg : '—';
                        }
                    }
                } catch {}

            } else {
                showToast('Не удалось сохранить оценку');
            }
        } catch {
            showToast('Ошибка сети');
        }
    }

    // ── COMMENTS MODAL (API-based, synced with recipe.html) ─────────────────
    let commentsRecipeId = null;
    let _commentStars = 0;
    const _reviewsCache = {}; // recipeId → [reviews]

    function openComments(recipeId) {
        commentsRecipeId = recipeId;
        const r = RECIPES[recipeId] || {};
        document.getElementById('comments-title').textContent = `💬 ${r.name || 'Отзывы'}`;
        document.getElementById('comments-body').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-3)">Загрузка…</div>';
        document.getElementById('comments-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
        loadCommentsFromAPI(recipeId);
    }
    function closeComments() {
        document.getElementById('comments-overlay').classList.remove('open');
        document.body.style.overflow = '';
        commentsRecipeId = null;
    }
    function closeCommentsIfOutside(e) {
        if (e.target === document.getElementById('comments-overlay')) closeComments();
    }

    async function loadCommentsFromAPI(recipeId) {
        try {
            const res = await fetch(API_BASE + '/content/reviews/' + encodeURIComponent(recipeId));
            if (!res.ok) throw new Error('API error');
            const reviews = await res.json();
            _reviewsCache[recipeId] = reviews;
            renderCommentsBody(reviews);
            updateCommentBadge(recipeId, reviews.length);
        } catch (e) {
            console.error('Reviews load error:', e);
            document.getElementById('comments-body').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-3)">Не удалось загрузить отзывы</div>';
        }
    }

    function renderCommentsBody(reviews) {
        const user = Auth.getUser();
        const curUserId = user ? user.id : null;
        const isAdmin = user && user.role === 'admin';
        const hasOwnReview = reviews.some(rv => curUserId && rv.userId === curUserId);

        function starsHtml(n) {
            return [1,2,3,4,5].map(i =>
                `<span class="star${i <= n ? ' filled' : ''}" style="font-size:14px;${i <= n ? 'color:#f5a623' : 'color:#ddd'}">★</span>`
            ).join('');
        }
        function fmtDate(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        const list = reviews.length
            ? `<div class="comments-list">${reviews.map(rv => {
                const canDelete = isAdmin || (curUserId && rv.userId === curUserId);
                const avatarHtml = rv.avatar
                    ? `<img class="review-avatar" src="${escHtml(rv.avatar)}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                      + `<span class="review-avatar-fallback" style="display:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">${escHtml(rv.author.charAt(0).toUpperCase())}</span>`
                    : `<span style="width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0">${escHtml(rv.author.charAt(0).toUpperCase())}</span>`;
                return `<div class="comment-item" style="display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)">
                    <div style="flex-shrink:0">${avatarHtml}</div>
                    <div style="flex:1;min-width:0">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
                            <span style="font-weight:700;font-size:14px;color:var(--text)">${escHtml(rv.author)}</span>
                            <div style="display:flex;align-items:center;gap:6px">
                                <span style="font-size:11px;color:var(--text-3)">${fmtDate(rv.createdAt)}</span>
                                ${canDelete ? `<button style="background:none;border:none;color:var(--text-3);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px" onclick="deleteCatReview(${rv.id},${isAdmin})" title="Удалить">✕</button>` : ''}
                            </div>
                        </div>
                        <div style="margin-bottom:4px">${starsHtml(rv.stars)}</div>
                        ${rv.text ? `<div style="font-size:13px;color:var(--text);line-height:1.5">${escHtml(rv.text)}</div>` : ''}
                    </div>
                </div>`;
            }).join('')}</div>`
            : `<div style="text-align:center;padding:24px 0;color:var(--text-3);font-size:14px">Пока нет отзывов. Будьте первым!</div>`;

        _commentStars = 0;
        const formHtml = Auth.isLoggedIn() && !hasOwnReview
            ? `<div class="comments-form" style="margin-top:14px">
                <div class="c-star-row">
                    <label>Оценка:</label>
                    ${[1,2,3,4,5].map(i => `<span class="cstar" data-n="${i}" onclick="selectStar(${i})">★</span>`).join('')}
                </div>
                <textarea class="c-input" id="c-text" placeholder="Ваш отзыв может помочь другим пользователям сделать выбор." rows="3"></textarea>
                <button class="btn btn-orange btn-full" id="c-submit-btn" onclick="submitComment()">Отправить</button>
            </div>`
            : Auth.isLoggedIn() && hasOwnReview
                ? `<div style="text-align:center;padding:16px;color:var(--text-3);font-size:13px">Вы уже оставили отзыв на этот рецепт</div>`
                : `<div style="text-align:center;padding:16px;color:var(--text-3);font-size:13px">Войдите, чтобы оставить отзыв</div>`;

        document.getElementById('comments-body').innerHTML = list + formHtml;
    }

    function selectStar(n) {
        _commentStars = n;
        document.querySelectorAll('#comments-body .cstar').forEach((s, i) =>
            s.classList.toggle('on', i < n));
    }

    window.deleteCatReview = async function(id, isAdmin) {
        if (!confirm('Удалить отзыв?')) return;
        try {
            const endpoint = isAdmin ? '/admin/reviews/' : '/content/reviews/';
            const res = await Auth.api(endpoint + id, { method: 'DELETE' });
            if (!res.ok) { showToast('Не удалось удалить'); return; }
            showToast('Отзыв удалён');
            loadCommentsFromAPI(commentsRecipeId);
        } catch (e) { showToast('Ошибка сети'); }
    };

    async function submitComment() {
        if (!_commentStars) { showToast('Выберите оценку'); return; }
        const text = (document.getElementById('c-text')?.value || '').trim();

        const btn = document.getElementById('c-submit-btn');
        if (btn) { btn.disabled = true; btn.textContent = '...'; }
        try {
            const body = { recipe_id: commentsRecipeId, stars: _commentStars, text: text || '⭐' };
            const res = await Auth.api('/content/reviews', {
                method: 'POST',
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                showToast(err.error || 'Ошибка');
                return;
            }
            showToast('Отзыв сохранён!');
            loadCommentsFromAPI(commentsRecipeId);
        } catch (e) {
            showToast('Ошибка сети');
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Отправить'; }
        }
    }

    function updateCommentBadge(recipeId, cnt) {
        const cbtn = document.getElementById('cbtn-' + recipeId);
        if (!cbtn) return;
        let badge = cbtn.querySelector('.photo-comment-badge');
        if (cnt > 0) {
            if (!badge) { badge = document.createElement('div'); badge.className = 'photo-comment-badge'; cbtn.appendChild(badge); }
            badge.textContent = cnt;
        } else if (badge) {
            badge.remove();
        }
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── FILTER GROUPS ─────────────────────────────────────────────────────────
    let openFGroup = null;

    function toggleFGroup(btn) {
        const dropId = btn.dataset.drop;
        const isOpen = openFGroup === dropId;
        closeFGroups();
        if (!isOpen) {
            const drop = document.getElementById(dropId);
            const rect = btn.getBoundingClientRect();
            drop.style.top  = (rect.bottom + window.scrollY + 4) + 'px';
            drop.style.left = Math.max(8, rect.left) + 'px';
            drop.style.display = 'flex';
            btn.classList.add('open');
            openFGroup = dropId;
        }
    }
    function closeFGroups() {
        document.querySelectorAll('.fgroup-drop').forEach(d => d.style.display = 'none');
        document.querySelectorAll('.fgroup-btn.open').forEach(b => b.classList.remove('open'));
        openFGroup = null;
    }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('[data-drop]') && !e.target.closest('.fgroup-drop')) closeFGroups();
    });

    function pickFilter(el, btnId) {
        const f = el.dataset.f, v = el.dataset.v;
        const btn   = document.getElementById(btnId);
        const drop  = document.getElementById(btn.dataset.drop);
        const alreadyOn = el.classList.contains('on');
        drop.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('on'));
        if (alreadyOn) {
            delete activeFilters[f];
            btn.classList.remove('has-value');
            btn.querySelector('.fg-label').textContent = btn.dataset.label;
        } else {
            el.classList.add('on');
            activeFilters[f] = f === 'time' ? (v === 'over60' ? 'over60' : +v) : v;
            btn.classList.add('has-value');
            btn.querySelector('.fg-label').textContent = el.textContent.trim();
        }
        closeFGroups();
        renderDishes();
    }

    function toggleTagFilter(el) {
        const f = el.dataset.f;
        if (el.classList.contains('on')) { el.classList.remove('on'); delete activeFilters[f]; }
        else { el.classList.add('on'); activeFilters[f] = true; }
        renderDishes();
    }

    function clearFilters() {
        Object.keys(activeFilters).forEach(k => delete activeFilters[k]);
        document.querySelectorAll('.filter-chip.on').forEach(c => c.classList.remove('on'));
        document.querySelectorAll('.fgroup-btn').forEach(b => {
            b.classList.remove('has-value');
            b.querySelector('.fg-label').textContent = b.dataset.label;
        });
        closeFGroups();
        renderDishes();
    }

    // My plate modal (minimal)

                    <div class="plate-item-info">
                        ${item.recipeId

                <div style="display:flex;gap:8px;margin-top:10px">
                    <button class="btn btn-orange" style="flex:1" onclick="location.href='index.html'">← На главную</button>
                    <button class="btn btn-ghost" style="flex-shrink:0" onclick="shareShoppingList()">📤 Список продуктов</button>

        document.body.style.overflow = 'hidden';

    function closePlate() {
        document.getElementById('plate-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }
    function closePlateIfOutside(e) { if (e.target === document.getElementById('plate-overlay')) closePlate(); }
    function removeItemCat(i) { Plate.remove(i); updatePlateIcon(); openPlate(); }
    function savePlateCat() {
        if (!Plate.count()) return;
        Plate.saveHistory();
