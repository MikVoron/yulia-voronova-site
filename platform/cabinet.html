<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой кабинет — Умная тарелка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style-v4.css">
    <style>
        /* ── PROFILE ── */
        .cab-profile {
            display: flex; align-items: center; gap: 20px;
            padding: 28px 0 24px;
            border-bottom: 1px solid var(--border);
        }
        .cab-ava-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
        .cab-ava {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--accent); color: #fff;
            font-family: var(--serif); font-size: 30px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 2px solid var(--border);
        }
        .cab-ava img { width: 100%; height: 100%; object-fit: cover; }
        .cab-ava-badge {
            position: absolute; bottom: 0; right: 0;
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--card);
            display: flex; align-items: center; justify-content: center;
        }
        .cab-ava-badge svg { width: 11px; height: 11px; fill: #fff; }
        .cab-name { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.15; }
        .cab-email { font-size: 13px; color: var(--text-3); margin-top: 3px; }
        .cab-since { font-size: 11px; color: var(--text-3); margin-top: 5px; }

        /* ── TABS ── */
        .cab-tabs {
            display: flex; gap: 0; margin: 20px 0 0;
            border-bottom: 2px solid var(--border);
            overflow-x: auto; scrollbar-width: none;
        }
        .cab-tabs::-webkit-scrollbar { display: none; }
        .cab-tab {
            padding: 10px 18px; font-size: 13px; font-weight: 700;
            color: var(--text-3); border: none; background: none; cursor: pointer;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            white-space: nowrap; transition: color .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .cab-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .cab-tab-panel { display: none; padding: 24px 0; }
        .cab-tab-panel.active { display: block; }

        /* ── ИСТОРИЯ ТАРЕЛОК ── */
        .hist-empty { text-align: center; padding: 50px 20px; color: var(--text-3); font-size: 14px; }
        .hist-entry {
            border: 1px solid var(--border); border-radius: var(--r-s);
            margin-bottom: 14px; overflow: hidden;
        }
        .hist-entry-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: var(--bg-alt);
            cursor: pointer; user-select: none;
        }
        .hist-date { font-size: 13px; font-weight: 700; color: var(--text); }
        .hist-macros { font-size: 12px; color: var(--text-3); margin-top: 2px; }
        .hist-arrow { font-size: 14px; color: var(--text-3); transition: transform .2s; }
        .hist-entry.open .hist-arrow { transform: rotate(180deg); }
        .hist-items { display: none; padding: 10px 16px 14px; }
        .hist-entry.open .hist-items { display: block; }
        .hist-item {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; border-bottom: 1px solid var(--border);
        }
        .hist-item:last-child { border-bottom: none; }
        .hist-item-emoji { font-size: 18px; flex-shrink: 0; }
        .hist-item-name { font-size: 13px; color: var(--text); flex: 1; }
        .hist-item-kcal { font-size: 12px; color: var(--text-3); flex-shrink: 0; }

        /* ── ИЗБРАННЫЕ ── */
        .fav-empty { text-align: center; padding: 50px 20px; color: var(--text-3); font-size: 14px; }

        /* ── ЗАМЕТКИ ── */
        .notes-wrap { display: flex; flex-direction: column; gap: 12px; }
        .notes-textarea {
            width: 100%; min-height: 200px; padding: 14px;
            font-family: var(--sans); font-size: 14px; color: var(--text);
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--r-s); resize: vertical; line-height: 1.6;
            box-sizing: border-box; outline: none; transition: border-color .2s;
        }
        .notes-textarea:focus { border-color: var(--accent); }
        .notes-saved { font-size: 12px; color: var(--text-3); height: 16px; }

        /* ── HEART BUTTON on cards ── */
        .card-fav-btn {
            position: absolute; top: 8px; right: 8px;
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(255,255,255,.88); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 2; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .card-fav-btn svg { width: 16px; height: 16px; }
        .card-fav-btn.active svg { fill: #e05; stroke: #e05; }
        .card-fav-btn:not(.active) svg { fill: none; stroke: #888; stroke-width: 2; }
    </style>
</head>

<main style="flex:1; padding-bottom: 80px;">
    <div class="v-wrap">

        <!-- Profile -->
        <div class="cab-profile anim">
            <div class="cab-ava-wrap" onclick="document.getElementById('ava-upload').click()">
                <div class="cab-ava" id="cab-ava">?</div>
                <div class="cab-ava-badge">
                    <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.83z"/></svg>
                </div>
            </div>
            <div>
                <div class="cab-name" id="cab-name">—</div>
                <div class="cab-email" id="cab-email"></div>
                <div class="cab-since" id="cab-since"></div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="cab-tabs">
            <button class="cab-tab active" onclick="switchTab('history',this)">История</button>
            <button class="cab-tab" onclick="switchTab('favorites',this)">Избранные</button>
            <button class="cab-tab" onclick="switchTab('notes',this)">Заметки</button>
        </div>

        <!-- История тарелок -->
        <div class="cab-tab-panel active" id="panel-history">
            <div id="history-body"></div>
        </div>

        <!-- Избранные -->
        <div class="cab-tab-panel" id="panel-favorites">
            <div class="recipe-card-grid" id="fav-grid"></div>
        </div>

        <!-- Заметки -->
        <div class="cab-tab-panel" id="panel-notes">
            <div class="notes-wrap">
                <div class="v-sec-title" style="margin-bottom:14px">Новая заметка</div>
                <textarea class="notes-textarea" id="notes-ta"
                    placeholder="Идеи рецептов, цели, наблюдения о питании…"></textarea>
                <button class="btn btn-green" style="margin-top:10px;align-self:flex-start" onclick="addNote()">Сохранить</button>
                <div id="notes-list" style="margin-top:28px"></div>
            </div>
        </div>

    </div>
</main>

<script src="data-v2.js?v=1773500000"></script>
<script>
    Auth.requireAuth();
    updatePlateIcon();

    // ── SCROLL HEADER ─────────────────────────────────────────────────────────
    window.addEventListener('scroll', () =>
        document.getElementById('hdr').classList.toggle('scrolled', scrollY > 10));

    // ── PROFILE ───────────────────────────────────────────────────────────────
    const user = Auth.getUser();
    if (user) {
        document.getElementById('cab-name').textContent = user.name || user.email;
        document.getElementById('cab-email').textContent = user.email;
        const joined = user.joined
            ? new Date(user.joined).toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' })
            : '';
        if (joined) document.getElementById('cab-since').textContent = 'В сервисе с ' + joined;
        const avaEl = document.getElementById('cab-ava');
        const savedAva = localStorage.getItem('user_avatar');
        if (savedAva) {
            avaEl.innerHTML = `<img src="${savedAva}" alt="avatar">`;
        } else {
            avaEl.textContent = (user.name || user.email || '?').charAt(0).toUpperCase();
        }
    }

    function handleAvatarUpload(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            localStorage.setItem('user_avatar', e.target.result);
            document.getElementById('cab-ava').innerHTML = `<img src="${e.target.result}" alt="avatar">`;
        };
        reader.readAsDataURL(file);
    }

    // ── TABS ──────────────────────────────────────────────────────────────────
    function switchTab(name, btn) {
        document.querySelectorAll('.cab-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.cab-tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + name).classList.add('active');
        if (name === 'history')   renderHistory();
        if (name === 'favorites') renderFavorites();
        if (name === 'notes')     loadNotes();
    }

    // ── ИСТОРИЯ ТАРЕЛОК ───────────────────────────────────────────────────────
    function renderHistory() {
        const hist = Plate.getHistory();
        const el = document.getElementById('history-body');
        if (!hist.length) {
            el.innerHTML = '<div class="hist-empty">История пока пуста.<br>Сохраните тарелку из главного меню.</div>';
            return;
        }
        el.innerHTML = hist.map((entry, idx) => {
            const d = new Date(entry.date);
            const dateStr = d.toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
            const timeStr = d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
            const t = entry.totals || {};
            const items = entry.items || [];
            return `<div class="hist-entry" id="he-${idx}">
                <div class="hist-entry-head" onclick="toggleHist(${idx})">
                    <div>
                        <div class="hist-date">${dateStr}, ${timeStr}</div>
                        <div class="hist-macros">${t.kcal||0} ккал · Б${t.protein||0} · Ж${t.fat||0} · У${t.carbs||0}</div>
                    </div>
                    <span class="hist-arrow">▾</span>
                </div>
                <div class="hist-items">
                    ${items.map(it => `<div class="hist-item">
                        <span class="hist-item-emoji">${it.emoji||'🍴'}</span>
                        <span class="hist-item-name">${it.name}</span>
                        <span class="hist-item-kcal">${it.kcal||0} ккал</span>
                    </div>`).join('')}
                </div>
            </div>`;
        }).join('');
    }

    function toggleHist(idx) {
        document.getElementById('he-' + idx).classList.toggle('open');
    }

    renderHistory();

    // ── ИЗБРАННЫЕ ─────────────────────────────────────────────────────────────
    function renderFavorites() {
        const ids = Favorites.get();
        const grid = document.getElementById('fav-grid');
        if (!ids.length) {
            grid.innerHTML = '<div class="fav-empty">Нет избранных рецептов.<br>Нажмите ♡ на карточке рецепта.</div>';
            return;
        }
        const dishes = ids.map(id => RECIPES[id]).filter(Boolean);
        grid.innerHTML = dishes.map(d => recipeCardHtml(d)).join('');
    }

    // ── ЗАМЕТКИ ───────────────────────────────────────────────────────────────
    let editingNoteId = null;

    function loadNotes() {
        renderNotesList();
    }

    function addNote() {
        const ta = document.getElementById('notes-ta');
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        if (editingNoteId) {
            Notes.update(editingNoteId, text);
            editingNoteId = null;
        } else {
            Notes.add(text);
        }
        ta.value = '';
        document.querySelector('.btn-green[onclick="addNote()"]').textContent = 'Сохранить';
        renderNotesList();
    }

    function renderNotesList() {
        const notes = Notes.get();
        const el = document.getElementById('notes-list');
        if (!notes.length) { el.innerHTML = ''; return; }
        const plural = n => n === 1 ? '1 заметка' : n <= 4 ? n + ' заметки' : n + ' заметок';
        el.innerHTML = `<div style="font-size:13px;color:var(--text-3);font-weight:600;margin-bottom:14px">${plural(notes.length)}</div>` +
            notes.map(n => {
                const d = new Date(n.updated || n.date);
                const dateStr = d.toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
                const preview = n.text.length > 80 ? n.text.slice(0, 80) + '…' : n.text;
                return `<div class="hist-entry" id="note-${n.id}">
                    <div class="hist-entry-head" onclick="toggleNote(${n.id})">
                        <div>
                            <div class="hist-date">${n.title}</div>
                            <div class="hist-macros">${dateStr} · ${n.text.split('\n').length} строк</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <button style="font-size:12px;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px"
                                onclick="event.stopPropagation();editNote(${n.id})">Изменить</button>
                            <button style="font-size:12px;color:var(--text-3);background:none;border:none;cursor:pointer;padding:4px"
                                onclick="event.stopPropagation();deleteNote(${n.id})">✕</button>
                            <span class="hist-arrow">▾</span>
                        </div>
                    </div>
                    <div class="hist-items" style="white-space:pre-wrap;font-size:13px;color:var(--text-2);line-height:1.6">${escHtml(n.text)}</div>
                </div>`;
            }).join('');
    }

    function toggleNote(id) {
        document.getElementById('note-' + id)?.classList.toggle('open');
    }
    function editNote(id) {
        const note = Notes.get().find(n => n.id === id);
        if (!note) return;
        editingNoteId = id;
        document.getElementById('notes-ta').value = note.text;
        document.querySelector('.btn-green[onclick="addNote()"]').textContent = 'Обновить';
        document.getElementById('notes-ta').scrollIntoView({ behavior: 'smooth', block: 'start' });
        document.getElementById('notes-ta').focus();
    }
    function deleteNote(id) {
        Notes.remove(id);
        if (editingNoteId === id) { editingNoteId = null; document.getElementById('notes-ta').value = ''; }
        renderNotesList();
    }
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function recipeCardHtml(d) {
        const diff = (typeof DIFF_LABELS !== 'undefined' ? DIFF_LABELS : {})[d.diff] || d.diff;
        const isFav = Favorites.has(d.id);
        const photoHtml = d.photo
            ? `<img src="${d.photo}" alt="${d.name}" loading="lazy"${d.imgPosition ? ` style="object-position:${d.imgPosition}"` : ''}>`
            : `<div class="recipe-card-emoji">${d.emoji}</div>`;
        return `<button class="recipe-card" onclick="goToRecipe('${d.id}')">
            <div class="recipe-card-photo" style="position:relative">
                ${photoHtml}
                <button class="card-fav-btn${isFav ? ' active' : ''}" id="fav-${d.id}"
                    onclick="event.stopPropagation();toggleFav('${d.id}')">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
            </div>
            <div class="recipe-card-body">
                <div class="recipe-card-name">${d.name}</div>
                <div class="recipe-card-meta">
                    <span class="pill">⏱ ${d.time} мин</span>
                    <span class="pill">${diff}</span>
                </div>
                <div class="recipe-card-kcal" style="margin-top:4px">${d.kcal} ккал</div>
            </div>
        </button>`;
    }

    function toggleFav(id) {
        const isNowFav = Favorites.toggle(id);
        const btn = document.getElementById('fav-' + id);
        if (btn) btn.classList.toggle('active', isNowFav);
        // If in favorites tab, refresh
        if (document.getElementById('panel-favorites').classList.contains('active')) {
            renderFavorites();
        }
    }

    function goToRecipe(id) {
        const r = RECIPES[id];
        location.href = `recipe.html?id=${id}&from=${r ? r.cat : 'breakfasts'}`;
    }

    // ── PLATE ─────────────────────────────────────────────────────────────────
    function openPlate() {
        const items = Plate.get();
        const body = document.getElementById('plate-body');
        if (!items.length) {
            body.innerHTML = '<div class="plate-empty"><div class="plate-empty-icon">🍽️</div><div class="plate-empty-text">Тарелка пока пуста</div></div>';
        } else {
            const t = Plate.totals();
            body.innerHTML = '<div class="plate-items">' +
                items.map((item, i) => `<div class="plate-item">
                    <div class="plate-item-emoji">${item.emoji || '🍴'}</div>
                    <div class="plate-item-info"><div class="plate-item-name">${item.name}</div>
                    <div class="plate-item-kcal">${item.kcal} ккал</div></div>
                    <button class="plate-item-remove" onclick="removePlateItem(${i})">✕</button>
                </div>`).join('') + '</div>' +
                `<div class="plate-totals">
                    <div class="plate-total-row"><span>Калории:</span><span>${t.kcal} ккал</span></div>
                    <div class="plate-total-row"><span>Белки:</span><span>${t.protein} г</span></div>
                    <div class="plate-total-row"><span>Жиры:</span><span>${t.fat} г</span></div>
                    <div class="plate-total-row"><span>Углеводы:</span><span>${t.carbs} г</span></div>
                </div>`;
        }
        document.getElementById('plate-overlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closePlate() {
        document.getElementById('plate-overlay').classList.remove('active');
        document.body.style.overflow = '';
    }
    function closePlateIfOutside(e) {
        if (e.target === document.getElementById('plate-overlay')) closePlate();
    }
    function removePlateItem(i) { Plate.remove(i); updatePlateIcon(); openPlate(); }
</script>
</body>
</html>
