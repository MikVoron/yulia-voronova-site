<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация — Умная тарелка</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100dvh; margin: 0; background: #fff; color: #111;
        }
        .cb-wrap { text-align: center; max-width: 360px; padding: 20px; }
        .cb-spinner {
            width: 40px; height: 40px; border: 3px solid #eee;
            border-top-color: #e8400a; border-radius: 50%;
            animation: spin .7s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cb-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .cb-sub { font-size: 14px; color: #777; }
        .cb-error { color: #c0392b; display: none; }
    </style>
</head>
<body>
<div class="cb-wrap">
    <div class="cb-spinner" id="spinner"></div>
    <div class="cb-title" id="title">Авторизация...</div>
    <div class="cb-sub" id="sub">Получаем данные</div>
    <div class="cb-error" id="error"></div>
</div>

<script src="data-v2.js?v=20260713-csp-template-actions"></script>
<script src="auth-callback.js?v=20260713-csp-external-scripts"></script>
</body>
</html>
