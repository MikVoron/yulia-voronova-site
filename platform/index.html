<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Конструктор питания — Юлия Воронова</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700;800&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
	<style>body{visibility:hidden}</style>
    <link rel="stylesheet" href="style-v4.css" id="vcss">
	<script>document.getElementById('vcss').href = 'style-v4.css?v=' + Date.now()</script>
	<style>
		.greeting {
			padding: 44px 0 0;
		}

		.greeting-hi {
			font-family: 'Playfair Display', var(--serif);
			font-size: clamp(26px, 4.5vw, 32px);
			font-weight: 700;
			color: #1a1a1a;
			margin-bottom: 10px;
			line-height: 1.15;
		}

		.greeting-sub {
			font-size: clamp(13px, 1.5vw, 14px);
			color: #666;
			font-family: 'Montserrat', var(--sans);
			font-weight: 500;
			letter-spacing: .03em;
			text-transform: none;
			margin-top: 8px;
		}

		main {
			padding-bottom: 80px;
		}

		/* ── HEADER BACKGROUND VARIANTS ─────────────────── */

		/* Header background — вариант 1: персиковый */
		.v-header {
			background: linear-gradient(180deg, #fffaf7 0%, #fef0e6 100%);
			border-bottom: 1px solid #f5c9b3;
			box-shadow: 0 4px 16px rgba(0,0,0,.08);
		}

		/* ── NEW HEADER ─────────────────────────────────── */
		.vh-inner {
			display: flex;
			align-items: center;
			gap: 14px;
			height: 82px;
		}

		/* Julia avatar */
		.vh-julia-ava {
			order: 1;
			width: 56px;
			height: 56px;
			border-radius: 50%;
			background: var(--accent-l) url('https://voronova.online/images/YV-small.webp') center/cover no-repeat;
			border: 2px solid var(--accent);
			flex-shrink: 0;
			box-shadow: 0 4px 14px rgba(232,64,10,.18);
		}

		/* Brand */
		.vh-brand {
			order: 2;
			display: inline-flex;
			flex-direction: column;
			gap: 2px;
			text-decoration: none;
			color: inherit;
			flex: 1;
		}
		.vh-brand-meta {
			display: flex;
			align-items: baseline;
			gap: 8px;
		}
		.vh-brand-name {
			font-family: var(--serif);
			font-size: 13px;
			font-weight: 600;
			color: var(--text-2);
		}
		.vh-brand-role {
			font-size: 9px;
			font-weight: 700;
			color: var(--text-3);
			text-transform: uppercase;
			letter-spacing: .1em;
		}
		.vh-brand-title {
			font-family: var(--serif);
			font-size: clamp(22px, 2.2vw, 30px);
			font-weight: 700;
			line-height: 1;
			color: var(--text);
		}
		.vh-accent { color: var(--accent); }

		/* Slogan (desktop right area, fixed width) */
		.vh-slogan-wrap {
			order: 3;
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
		}
		.vh-slogan-wrap::before {
			content: '';
			position: absolute;
			width: 280px;
			height: 110px;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			border-radius: 999px;
			background: radial-gradient(circle, rgba(232,64,10,.14) 0%, rgba(232,64,10,.07) 40%, rgba(232,64,10,0) 78%);
			pointer-events: none;
			z-index: 0;
		}
		.vh-slogan {
			font-family: 'DM Serif Text', var(--serif);
			font-size: 14px;
			line-height: 1.22;
			color: #9a4f2d;
			text-align: center;
			max-width: 22ch;
			position: relative;
			z-index: 1;
		}

		/* Profile pill */
		.vh-inner > .v-user-wrap {
			order: 4;
			flex-shrink: 0;
			position: relative;
			margin-left: 24px;
		}
		.vh-profile-pill {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			min-height: 42px;
			padding: 5px 14px 5px 5px;
			background: #fff7f3;
			border: 1.5px solid rgba(232,64,10,.28);
			border-radius: 999px;
			color: var(--text-2);
			cursor: pointer;
			font: inherit;
		}
		.vh-profile-pill:hover { background: #ffe8de; }
		.vh-profile-name {
			font-size: 13px;
			font-weight: 600;
		}

		/* Plate button */
		.vh-plate-btn {
			order: 5;
			position: relative;
			width: 42px;
			height: 42px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			background: var(--accent-l);
			border: 1px solid rgba(232,64,10,.2);
			border-radius: 50%;
			cursor: pointer;
			flex-shrink: 0;
			padding: 0;
		}
		.vh-plate-btn:hover { background: #fde5da; }
		.vh-plate-icon {
			position: relative;
			width: 25px;
			height: 25px;
			border-radius: 50%;
			overflow: hidden;
			background: #fff;
			border: 1px solid #d0d0d0;
		}
		.vh-slice { position: absolute; }
		.vh-slice-g { inset: 0 50% 0 0; background: #6aaa6a; }
		.vh-slice-y { inset: 0 0 50% 50%; background: #f0b840; }
		.vh-slice-r { inset: 50% 0 0 50%; background: #e07070; }
		.vh-plate-btn .plate-count {
			position: absolute;
			top: -3px;
			right: -3px;
			min-width: 18px;
			height: 18px;
			padding: 0 5px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 999px;
			background: var(--text);
			color: #fff;
			box-shadow: 0 0 0 2px #fff;
			font-size: 10px;
			font-weight: 700;
		}

		/* ── MOBILE ──────────────────────────────────────── */
		@media (max-width: 767px) {
			.vh-inner { gap: 8px; height: 68px; }

			/* Julia big photo — hide */
			.vh-julia-ava { display: none; }

			/* Slogan — hide */
			.vh-slogan-wrap { display: none; }

			/* Profile pill → left (order 1), becomes round icon */
			.vh-inner > .v-user-wrap { order: 1; position: static; transform: none; left: auto; top: auto; }
			.vh-profile-pill {
				width: 42px;
				min-height: 42px;
				padding: 0;
				justify-content: center;
				border-radius: 50%;
			}
			.vh-profile-name { display: none; }

			/* Brand → center (order 2), centered text */
			.vh-brand {
				order: 2;
				flex: 1;
				align-items: center;
				text-align: center;
			}
			.vh-brand-meta { justify-content: center; }
			.vh-brand-title { font-size: 21px; }

			/* Plate button → right (order 3) */
			.vh-plate-btn { order: 3; }
		}

		.recipes-total-count {
			display: inline-flex;
			align-items: baseline;
			gap: 8px;
		}
		.recipes-total-count .rtc-num {
			font-family: var(--serif);
			font-size: clamp(36px, 5vw, 58px);
			font-weight: 700;
			line-height: 1;
			color: var(--text);
			letter-spacing: -1px;
		}
		.recipes-total-count .rtc-label {
			font-family: var(--sans);
			font-size: clamp(11px, 1.2vw, 13px);
			font-weight: 700;
			color: var(--text);
			letter-spacing: .04em;
			text-transform: uppercase;
			background: #f5d90a;
			padding: 3px 8px;
			border-radius: 4px;
			vertical-align: middle;
		}
	</style>
</head>

				<span class="vh-julia-ava" aria-hidden="true"></span>

				<a href="index.html" class="vh-brand">

						<span class="vh-profile-name" id="u-name">Войти</span>
					</button>
					<div class="user-dropdown" id="user-dropdown">

						<button class="user-dd-item user-dd-logout" onclick="doLogout()">🚪 Выйти</button>
					</div>
				</div>

				<!-- Plate button: order 5 desktop, order 3 mobile (right) -->
				<button class="vh-plate-btn" id="plate-btn" onclick="openPlate()" type="button" aria-label="Моя тарелка">

				</button>

			</div>
		</div>
	</header>

	<!-- MAIN -->
	<main style="flex:1; padding-bottom: 80px;">
		<div class="v-wrap">

			<!-- Greeting -->

				</div>

				<div class="julia-strip anim anim-d1" style="margin: 28px 0 36px;">
					<div class="julia-ava" style="background:none;padding:0;overflow:hidden;">
						<img src="https://voronova.online/images/YV-small.webp" alt="Юлия" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.parentElement.textContent='👩‍🍳'">
					</div>
					<div class="julia-info">
						<div class="julia-text" id="julia-quote"></div>

				</div>
				<div id="plate-inline-body"></div>
			</div>

			<!-- News feed -->
			<div class="v-sec-head anim anim-d2">
				<div class="v-sec-title">Новости</div>
			</div>
			<div class="news-feed anim anim-d2" id="news-feed"></div>

			<!-- Filters -->
			<div class="filter-outer anim anim-d1">
				<div class="filter-scroll-wrap">
					<div class="filter-bar" id="filter-row">
						<button class="fgroup-btn" id="fg-time-btn" data-label="Время" data-drop="fg-time-drop" onclick="toggleFGroup(this)">
							<span class="fg-label">Время</span>
							<svg class="fg-arrow" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M1 1l4 4 4-4" />
							</svg>
						</button>
						<button class="fgroup-btn" id="fg-diff-btn" data-label="Сложность" data-drop="fg-diff-drop" onclick="toggleFGroup(this)">
							<span class="fg-label">Сложность</span>
							<svg class="fg-arrow" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="2">
								<path d="M1 1l4 4 4-4" />
							</svg>
						</button>
						<div class="filter-sep"></div>
						<button class="filter-chip" data-f="gluten" onclick="toggleTagFilter(this)">Без глютена</button>
						<button class="filter-chip" data-f="plant" onclick="toggleTagFilter(this)">Растительные</button>
						<button class="filter-chip" data-f="fish" onclick="toggleTagFilter(this)">Рыбные</button>
						<button class="filter-chip" data-f="noSoy" onclick="toggleTagFilter(this)">Без сои</button>

					</div>
				</div>
				<button class="filter-clear" onclick="clearFilters()">↺ Сбросить</button>
			</div>

			<!-- Categories -->
			<div class="v-sec-head anim anim-d2" style="align-items:baseline;gap:14px">
				<div class="v-sec-title">Категории</div>
				<div class="recipes-total-count" id="recipes-total-count"></div>
			</div>
			<div class="cat-grid anim anim-d2" id="cat-grid"></div>

		</div>
	</main>

	<!-- MY PLATE MODAL -->
	<div class="modal-overlay" id="plate-overlay" onclick="closePlateIfOutside(event)">
		<div class="modal-box" id="plate-modal">

	<script>
		function escHtml(s) {
			return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
		}
		Auth.requireAuth();
		loadContent().then(function() {
			if (isContentError()) {
				showApiError(document.getElementById('cat-grid'));
				return;
			}
			Auth.checkAccess().finally(function() {
				loadNewsFeed();
				renderCats();
				updateRecipeCount();
			});
		});
		const user = Auth.getUser();

		// Quote bank — rotates without repeating
		(function () {
			const quotes = [
				'Каждый приём пищи — возможность дать телу то, что ему нужно.',
				'Сбалансированная тарелка — это не ограничения, а инструмент заботы о себе.',
				'Не нужно есть идеально. Нужно есть осознанно.',
				'Растительный белок так же полноценен, если сочетать источники правильно.',
				'Клетчатка — лучшая еда для вашего микробиома. Чем разнообразнее — тем лучше.',
				'Голод — сигнал тела, а не слабость характера. Учитесь его слышать.',
				'Хорошее питание не требует сложных расчётов — нужна привычка и осознанность.',
				'Ешьте радугу: чем больше цветов в тарелке, тем больше нутриентов.',
			];
			const KEY = 'julia_quote_day';
			const today = new Date().toDateString();
			const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
			let pick;
			if (saved && saved.date === today) {
				pick = saved.idx;
			} else {
				const shown = saved ? (saved.shown || []) : [];
				const remaining = quotes.map((_, i) => i).filter(i => !shown.includes(i));
				const pool = remaining.length ? remaining : quotes.map((_, i) => i);
				pick = pool[Math.floor(Math.random() * pool.length)];
				const nextShown = [...shown, pick].slice(-quotes.length);
				localStorage.setItem(KEY, JSON.stringify({ date: today, idx: pick, shown: nextShown }));
			}
			const el = document.getElementById('julia-quote');
			if (el) el.textContent = '«' + quotes[pick] + '»';
		})();

		// Фото для карточек категорий
		const CAT_PHOTOS = {
			breakfasts: 'https://voronova.online/images/blog/random-pic-blog-5..webp',
			mains: 'https://voronova.online/images/cook-healthy-food.webp',
			pancakes: 'https://voronova.online/images/blog/random-pic-blog-2.webp',
			spreads: 'https://voronova.online/images/blog/random-pic-blog-3.webp',
			salads: 'https://voronova.online/images/blog/random-pic-blog-4.webp',
			drinks: 'https://voronova.online/images/blog/random-pic-blog-1.webp',
		};

		// Init header
		if (user) {
			const customName = Auth.getDisplayName();
			const shortName = customName || user.email.split('@')[0];
			const uAva = document.getElementById('u-ava');
			const savedAva = localStorage.getItem(Auth._userKey('user_avatar'));
			if (savedAva) {
				uAva.innerHTML = `<img src="${savedAva}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
			} else {
				uAva.textContent = (customName || user.email || '?').charAt(0).toUpperCase();
			}
			document.getElementById('u-name').textContent = customName || user.email.split('@')[0];
			const timeGreet = new Date().getHours() < 12 ? 'Доброе утро' :
					new Date().getHours() < 17 ? 'Добрый день' : 'Добрый вечер';
			if (customName) {
				document.getElementById('greeting-hi').innerHTML =
					timeGreet + ', <span style="color:var(--accent)">' + customName + '</span>!';
			} else {
				document.getElementById('greeting-hi').innerHTML = timeGreet + '!';
			}
		}
		updatePlateIcon();

		// Scroll effect
		window.addEventListener('scroll', () =>
			document.getElementById('hdr').classList.toggle('scrolled', scrollY > 10));

		// ── CATEGORIES ───────────────────────────────────────────────────────
		function pluralR(n) {
			const m10 = n % 10, m100 = n % 100;
			if (m100 >= 11 && m100 <= 14) return n + ' рецептов';
			if (m10 === 1) return n + ' рецепт';
			if (m10 >= 2 && m10 <= 4) return n + ' рецепта';
			return n + ' рецептов';
		}

		const activeFilters = {};

		function renderCats() {
			const grid = document.getElementById('cat-grid');
			grid.innerHTML = Object.values(CATEGORIES).map(cat => {
				const _id = encodeURIComponent(cat.id);
				const _name = escHtml(cat.name);
				const _desc = escHtml(cat.desc);
				const _emoji = escHtml(cat.emoji);
				const count = getCategoryDishes(cat.id, activeFilters).length;
				const total = getCategoryDishes(cat.id, {}).length;
				const photo = CAT_PHOTOS[cat.id] || '';
				const photoHtml = photo
					? `<img src="${escHtml(photo)}" alt="${_name}" loading="lazy">`
					: `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:48px">${_emoji}</div>`;
				return `<button class="cat-card" onclick="goToCategory('${_id}')">
                <div class="cat-icon-wrap">${photoHtml}</div>
                <div class="cat-body">
                    <div class="cat-name">${_name}</div>
                    <div class="cat-desc">${_desc}</div>
                    <div class="cat-count">${pluralR(count)}</div>
                </div>
            </button>`;
			}).join('');
		}
		// ── NEWS FEED ─────────────────────────────────────────────────────────
		let NEWS_FEED = [];

		async function loadNewsFeed() {
			try {
				const res = await fetch(API_BASE + '/content/news?limit=20');
				if (res.ok) {
					const data = await res.json();
					const all = data.map(function(n) {
						var d = new Date(n.created_at);
						var dateStr = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
						return { type: n.type, text: n.text, id: n.recipe_id, badge: n.badge, label: n.label, date: dateStr };
					});
					// 1 закреплённая новость-рецепт (последняя) + 3 текстовые
					var pinnedRecipe = all.find(function(n) { return n.type === 'recipe'; });
					var textNews = all.filter(function(n) { return n.type === 'news'; }).slice(0, 3);
					NEWS_FEED = [];
					if (pinnedRecipe) NEWS_FEED.push(pinnedRecipe);
					NEWS_FEED = NEWS_FEED.concat(textNews);
				}
			} catch {}
			renderNewsFeed();
		}

		function imgFallback(img, emoji) {
			img.onerror = null;
			img.style.display = 'none';
			var d = document.createElement('div');
			d.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;font-size:56px';
			d.textContent = emoji;
			img.parentElement.insertBefore(d, img);
		}

		function renderNewsFeed() {
			const diff_labels = typeof DIFF_LABELS !== 'undefined' ? DIFF_LABELS : {};
			const feed = document.getElementById('news-feed');
			if (!feed) return;
			if (!NEWS_FEED.length) { feed.innerHTML = ''; return; }
			const items = NEWS_FEED;
			feed.innerHTML = items.map(function (item, idx) {
				let html = '';
				if (item.type === 'news') {
					html = `<div class="news-text-card">
                    <div class="news-text-card-date">${escHtml(item.date || '')}</div>
                    <div class="news-text-card-top">
                        <div class="news-text-card-ava">
                            <img src="https://voronova.online/images/YV-small.webp" alt="Юлия" onerror="this.parentElement.textContent='👩‍🍳'">
                        </div>
                        <div class="news-text-card-author">Юлия Воронова</div>
                    </div>
                    <div class="news-text-card-body">${escHtml(item.text || '')}</div>
                </div>`;
				} else if (item.type === 'recipe') {
					const d = RECIPES[item.id];
					if (!d) return '';
					const _id = encodeURIComponent(d.id);
					const _cat = encodeURIComponent(d.cat);
					const _name = escHtml(String(d.name || ''));
					const _photo = escHtml(String(d.photo || ''));
					const _emoji = escHtml(String(d.emoji || '🍴'));
					const _diff = escHtml(String(diff_labels[d.diff] || d.diff || ''));
					const _time = Number(d.time) || 0;
					const _kcal = Number(d.kcal) || 0;
					const _protein = Number(d.protein) || 0;
					const locked = Auth.isTrial() && !d.free;
					const photoHtml = _photo
						? `<img src="${_photo}" alt="${_name}" loading="lazy" onerror="imgFallback(this,'${_emoji}')">`
						: `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:56px">${_emoji}</div>`;
					const lockBadge = locked ? '<div class="locked-badge"><svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>Pro</div>' : '';
					html = `<button class="featured-card${locked ? ' locked' : ''}" onclick="${locked ? 'showLockedMsg()' : "location.href=\'recipe.html?id=" + _id + "&from=" + _cat + "\'"}">
                    <div class="featured-card-photo" style="position:relative">
                        ${photoHtml}
                        ${lockBadge}
                        ${item.badge ? '<div class="card-new-badge">' + escHtml(String(item.badge)) + '</div>' : ''}
                    </div>
                    <div class="featured-card-body">
                        ${item.date ? '<div class="news-item-date">' + escHtml(item.date) + '</div>' : ''}
                        <div class="featured-card-name">${_name}</div>
                        <div class="featured-card-meta">
                            <span class="pill">⏱ ${_time} мин</span>
                            <span class="pill">${_diff}</span>
                        </div>
                        <div class="featured-card-kcal">${_kcal} ккал · ${_protein}г белка</div>
                    </div>
                </button>`;
				}
				const divider = (html && idx < items.length - 1) ? '<div class="news-divider"></div>' : '';
				return html + divider;
			}).join('');
		}
		renderPlateInline();

		// Recipe total count (updated after renderCats which runs after loadContent)
		function updateRecipeCount() {
			const rcEl = document.getElementById('recipes-total-count');
			if (rcEl) {
				const n = Object.keys(RECIPES).length;
				rcEl.innerHTML = `<span class="rtc-num">${n}</span><span class="rtc-label">рецептов</span>`;
			}
		}

		function showLockedMsg() {
			const existing = document.getElementById('locked-toast');
			if (existing) existing.remove();
			const toast = document.createElement('div');
			toast.id = 'locked-toast';
			toast.innerHTML = 'Этот рецепт доступен по подписке. <a href="cabinet.html" style="color:#fff;text-decoration:underline">Оформить</a>';
			Object.assign(toast.style, { position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)', background:'#333', color:'#fff', padding:'12px 20px', borderRadius:'12px', fontSize:'14px', zIndex:'9999', textAlign:'center', maxWidth:'320px' });
			document.body.appendChild(toast);
			setTimeout(() => toast.remove(), 4000);
		}

		function goToCategory(catId) {
			const hasFilters = Object.keys(activeFilters).length > 0;
			if (hasFilters) sessionStorage.setItem('platform_filters', JSON.stringify(activeFilters));
			else sessionStorage.removeItem('platform_filters');
			location.href = 'category.html?cat=' + catId;
		}

		// ── FILTERS ──────────────────────────────────────────────────────────
		let openFGroup = null;
		function toggleFGroup(btn) {
			const dropId = btn.dataset.drop;
			const isOpen = openFGroup === dropId;
			closeFGroups();
			if (!isOpen) {
				const drop = document.getElementById(dropId);
				const rect = btn.getBoundingClientRect();
				drop.style.top = (rect.bottom + window.scrollY + 4) + 'px';
				drop.style.left = Math.max(8, rect.left) + 'px';
				drop.style.display = 'flex';
				btn.classList.add('open');
				openFGroup = dropId;
			}
		}
		function closeFGroups() {
			document.querySelectorAll('.fgroup-drop').forEach(d => d.style.display = 'none');
			document.querySelectorAll('.fgroup-btn.open').forEach(b => b.classList.remove('open'));
			openFGroup = null;
		}
		document.addEventListener('click', function (e) {
			if (!e.target.closest('[data-drop]') && !e.target.closest('.fgroup-drop')) closeFGroups();
		});
		function pickFilter(el, btnId) {
			const f = el.dataset.f, v = el.dataset.v;
			const btn = document.getElementById(btnId);
			const drop = document.getElementById(btn.dataset.drop);
			const alreadyOn = el.classList.contains('on');
			drop.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('on'));
			if (alreadyOn) {
				delete activeFilters[f];
				btn.classList.remove('has-value');
				btn.querySelector('.fg-label').textContent = btn.dataset.label;
			} else {
				el.classList.add('on');
				activeFilters[f] = f === 'time' ? (v === 'over60' ? 'over60' : +v) : v;
				btn.classList.add('has-value');
				btn.querySelector('.fg-label').textContent = el.textContent.trim();
			}
			closeFGroups();
			renderCats();
		}
		function toggleTagFilter(el) {
			const f = el.dataset.f;
			if (el.classList.contains('on')) { el.classList.remove('on'); delete activeFilters[f]; }
			else { el.classList.add('on'); activeFilters[f] = true; }
			renderCats();
		}
		function clearFilters() {
			Object.keys(activeFilters).forEach(k => delete activeFilters[k]);
			document.querySelectorAll('.filter-chip.on').forEach(c => c.classList.remove('on'));
			document.querySelectorAll('.fgroup-btn').forEach(b => {
				b.classList.remove('has-value');
				b.querySelector('.fg-label').textContent = b.dataset.label;
			});
			closeFGroups();
			renderCats();
		}

		// ── MY PLATE MODAL ───────────────────────────────────────────────────
		function openPlate() {
			renderPlateModal();
			document.getElementById('plate-overlay').classList.add('open');
			document.body.style.overflow = 'hidden';
		}
		function closePlate() {
			document.getElementById('plate-overlay').classList.remove('open');
			document.body.style.overflow = '';
		}
		function closePlateIfOutside(e) { if (e.target === document.getElementById('plate-overlay')) closePlate(); }

		function renderPlateModal() {
			const items = Plate.get();
			const body = document.getElementById('plate-body');
			const footer = document.getElementById('plate-footer');

			if (!items.length) {
				body.innerHTML = `<div class="plate-empty">
                <div class="plate-empty-icon">🍽️</div>
                <div class="plate-empty-text">Тарелка пока пуста</div>
                <div class="plate-empty-sub">Выберите категорию и добавьте блюда</div>
            </div>`;
				footer.style.display = 'none';
				return;
			}

			const t = Plate.totals();
			const list = items.map((item, i) => `
            <div class="plate-item" id="pi-${i}">
                ${item.photo
					? `<img class="plate-item-photo" src="${item.photo}" alt="">`
					: `<div class="plate-item-emoji">${item.emoji || '🍴'}</div>`}
                <div class="plate-item-info">
                    ${item.recipeId
					? `<div class="plate-item-name" style="cursor:pointer;color:var(--green-d)" onclick="closePlate();location.href='recipe.html?id=${item.recipeId}&from=plate&simple=1'">${item.name}</div>`
					: `<div class="plate-item-name">${item.name}</div>`}
                    <div class="plate-item-kcal">${item.kcal} ккал · Б${item.protein}г · Ж${item.fat}г · У${item.carbs}г</div>
                </div>
                <button class="plate-item-del" onclick="removeItem(${i})">✕</button>
            </div>`).join('');

			body.innerHTML = `
            <div class="plate-items">${list}</div>
            <div class="plate-total-block">
                <div class="plate-total-title">Итого</div>
                <div class="plate-total-val">${t.kcal} ккал | Б: ${t.protein}г | Ж: ${t.fat}г | У: ${t.carbs}г${t.fiber ? ' | Кл: ' + t.fiber + 'г' : ''}</div>
            </div>
            <div class="water-row" style="margin-top:12px">
                <div class="water-label">💧 Ваш вес:</div>
                <input class="water-inp" type="number" id="w-inp" value="60" min="30" max="200" oninput="updateWater()">
                <div class="water-label">кг</div>
                <div class="water-result" id="w-res">→ 1800 мл</div>
            </div>
            <div class="shop-ask" id="shop-block" style="margin-top:14px">
                <div class="shop-ask-text">🛒 Список покупок</div>
                <div class="shop-ask-btns">
                    <button class="btn btn-orange btn-sm" onclick="doShare()">Поделиться</button>
                    <button class="btn btn-ghost btn-sm" onclick="doCopy()">Скопировать</button>
                </div>
            </div>`;
			footer.style.display = 'block';
		}

		function removeItem(i) { Plate.remove(i); renderPlateModal(); updatePlateIcon(); renderPlateInline(); }
		function updateWater() {
			const w = parseInt(document.getElementById('w-inp').value) || 60;
			document.getElementById('w-res').textContent = '→ ' + (w * 30) + ' мл';
		}
		function doShare() { shareShoppingList(); }
		function doCopy() {
			navigator.clipboard.writeText(buildShoppingList())
				.then(() => showToast('📋 Список скопирован!'))
				.catch(() => showToast('Не удалось скопировать'));
		}
		function savePlate() { Plate.saveHistory(); renderPlateModal(); renderPlateInline(); showToast('Тарелка сохранена в историю 🎉'); }

		// ── INLINE PLATE SECTION ─────────────────────────────────────────────
		function renderPlateInline() {
			const items = Plate.get();
			const section = document.getElementById('plate-inline-section');
			const introBlock = document.getElementById('intro-block');
			if (!items.length) {
				section.style.display = 'none';
				if (introBlock) introBlock.style.display = '';
				return;
			}
			if (introBlock) introBlock.style.display = 'none';
			section.style.display = 'block';
			const t = Plate.totals();
			const body = document.getElementById('plate-inline-body');
			const list = items.map((item, i) => `
            <div class="plate-item">
                ${item.photo
					? `<img class="plate-item-photo" src="${item.photo}" alt="">`
					: `<div class="plate-item-emoji">${item.emoji || '🍴'}</div>`}
                <div class="plate-item-info">
                    ${item.recipeId
					? `<div class="plate-item-name" style="cursor:pointer;color:var(--green-d)" onclick="location.href='recipe.html?id=${item.recipeId}&from=plate&simple=1'">${item.name}</div>`
					: `<div class="plate-item-name">${item.name}</div>`}
                    <div class="plate-item-kcal">${item.kcal} ккал · Б${item.protein}г · Ж${item.fat}г · У${item.carbs}г</div>
                </div>
                <button class="plate-item-del" onclick="removeItemInline(${i})">✕</button>
            </div>`).join('');
			body.innerHTML = `
            <div class="plate-items" style="margin-bottom:12px">${list}</div>
            <div class="plate-total-block">
                <div class="plate-total-title">Итого</div>
                <div class="plate-total-val">${t.kcal} ккал | Б: ${t.protein}г | Ж: ${t.fat}г | У: ${t.carbs}г${t.fiber ? ' | Кл: ' + t.fiber + 'г' : ''}</div>
            </div>`;
		}
		function removeItemInline(i) { Plate.remove(i); renderPlateInline(); updatePlateIcon(); }
		function clearPlateInline() { Plate.clear(); renderPlateInline(); updatePlateIcon(); }

		// Swipe to close
		let sy = 0;
		document.getElementById('plate-modal').addEventListener('touchstart', e => { sy = e.touches[0].clientY; }, { passive: true });
		document.getElementById('plate-modal').addEventListener('touchend', e => { if (e.changedTouches[0].clientY - sy > 80) closePlate(); }, { passive: true });

		// ── USER DROPDOWN ────────────────────────────────────────────────────
		function toggleUserMenu(e) {
			e.stopPropagation();
			document.getElementById('user-dropdown').classList.toggle('open');
		}
		document.addEventListener('click', function (e) {
			const wrap = document.getElementById('user-wrap');
			if (wrap && !wrap.contains(e.target)) {
				document.getElementById('user-dropdown').classList.remove('open');
			}
		});

		// Restore avatar from localStorage on load
		if (user && user.avatar) {
			const ava = document.getElementById('u-ava');
			ava.style.backgroundImage = `url(${user.avatar})`;
			ava.style.backgroundSize = 'cover';
			ava.textContent = '';
		}

		function doLogout() {
			document.getElementById('user-dropdown').classList.remove('open');
			const overlay = document.createElement('div');
			overlay.className = 'farewell-overlay';
			overlay.innerHTML = `<div class="farewell-emoji">👋</div>
            <div class="farewell-text">До встречи!</div>
            <div class="farewell-sub">Возвращайтесь — мы ждём вас</div>`;
			document.body.appendChild(overlay);
			requestAnimationFrame(() => overlay.classList.add('show'));
			setTimeout(() => {
				Auth.logout();
				location.href = 'login.html';
			}, 1800);
		}
	</script>
